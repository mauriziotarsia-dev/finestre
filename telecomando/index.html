<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atmosphere">
<link rel="apple-touch-icon" href="icona.png">
<link rel="icon" href="icona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<title>DMaster Atmosphere</title>
<style>
/* Lo stile di DMaster Stage (styles/tokens.css, stile-casa.css): ardesia scura, un solo accento,
   l'oro, a filo; titoli in Cinzel spaziato, righe di contorno in corsivo da libro, testo in Inter;
   icone disegnate a filo. Il corallo solo per «sta succedendo adesso». */
:root{
  color-scheme: dark;
  --bg:#06080c; --notte:#0b0f16; --pannello:#121822; --rialzo:#1a2230; --incasso:#080b12;
  --bordo:#2a2e38; --bordo-forte:#3d4250; --filo:rgba(212,175,55,.16); --filo-forte:rgba(212,175,55,.5);
  --oro:#d4af37; --oro-luce:#f0cb5b; --oro-veste:rgba(212,175,55,.12);
  --testo:#e8dcc0; --crema:#d9cfb6; --tenue:#a69b82; --spento:#6b6555;
  --live:#e87960; --ok:#8fd08f; --no:#e08a8a;
  --display:'Cinzel','Trajan Pro',Georgia,serif; --libro:'Cormorant Garamond',Georgia,serif;
  --corpo:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --barra:calc(66px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--testo);font:16px/1.45 var(--corpo);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%, #111826 0%, var(--bg) 60%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(212,175,55,.32);color:#fff6dc}
.ic{display:block;flex:none}

main{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(var(--barra) + 24px)}
.scheda{display:none}
.scheda.attiva{display:block;animation:entra .28s cubic-bezier(.16,1,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}


.in-mano-avviso{margin:0 0 14px;padding:12px 14px;border:1px solid var(--filo-forte);border-radius:12px;background:var(--oro-veste);color:var(--crema);font-size:14px;line-height:1.45}
.in-mano-avviso b{display:block;font:500 12px/1.2 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--oro-luce);margin-bottom:4px}
body.in-mano .scheda [data-fai]:not([data-fai="copia"]){opacity:.55}

/* testata di pagina, come la home di DMaster */
.testa{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 12px;margin-bottom:16px;
  border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(212,175,55,.45),rgba(212,175,55,.04)) 1}
.testa h1{margin:0;font:500 21px/1.1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--testo);display:flex;align-items:center;gap:10px}
.testa h1 .ic{color:var(--oro)}
.testa p{margin:5px 0 0;font:italic 500 18px/1.3 var(--libro);color:var(--crema)}
.testa > div{min-width:0}
.spia{flex:none;display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--spento);white-space:nowrap;padding-bottom:3px}
.spia i{width:7px;height:7px;border-radius:9px;background:var(--spento)}
.spia.viva{color:var(--live)} .spia.viva i{background:var(--live);box-shadow:0 0 8px var(--live)}

/* sezioni */
.sezione{margin-top:18px}
.titolo{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:500 12.5px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--oro-luce)}
.titolo .ic{color:var(--oro)}
.titolo small{margin-left:auto;font:italic 500 15px var(--libro);letter-spacing:0;text-transform:none;color:var(--tenue)}
.pannello{background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,0)),var(--pannello);border:1px solid var(--bordo);border-radius:12px;padding:14px}
.nota{font:italic 500 16px/1.35 var(--libro);color:var(--tenue);margin:8px 0 0}
.nota a{color:var(--oro)}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:8px;cursor:pointer;
  background:rgba(0,0,0,.28);border:1px solid var(--bordo-forte);color:var(--crema);font:500 12.5px var(--display);letter-spacing:.1em;text-transform:uppercase;
  transition:border-color .18s,color .18s,background .18s,transform .12s}
.btn:active{transform:scale(.98)}
.btn .ic{color:var(--oro)}
.btn.oro{background:linear-gradient(180deg,rgba(212,175,55,.3),rgba(212,175,55,.16)),#15110a;color:var(--oro-luce);border-color:rgba(212,175,55,.75);box-shadow:0 4px 18px rgba(212,175,55,.12);font-weight:600}
.btn.oro .ic{color:var(--oro-luce)}
.btn.piena{width:100%}
.btn.piccolo{min-height:36px;padding:6px 10px;font-size:11.5px}
.btn.pericolo{color:var(--no);border-color:rgba(224,138,138,.35)} .btn.pericolo .ic{color:var(--no)}
.btn:disabled{opacity:.4;cursor:default}

/* scelte (stato acceso: oro + velo + anello, mai pieno) */
.scelte{display:grid;gap:8px}
.scelte.c5{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px} .scelte.c3{grid-template-columns:repeat(3,minmax(0,1fr))} .scelte.c2{grid-template-columns:repeat(2,minmax(0,1fr))} .scelte.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.scelte.c5 .scelta{font-size:9.5px;letter-spacing:.03em;padding:8px 2px}
.scelta span{overflow-wrap:anywhere;line-height:1.2}
.scelta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;padding:8px 4px;border-radius:10px;cursor:pointer;
  background:var(--incasso);border:1px solid var(--bordo);color:var(--tenue);font:500 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:center;transition:all .18s}
.scelta .ic{color:var(--crema);opacity:.85}
.scelta[aria-pressed="true"]{color:var(--oro-luce);border-color:var(--oro);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.04));box-shadow:0 0 0 1px rgba(212,175,55,.2)}
.scelta[aria-pressed="true"] .ic{color:var(--oro-luce);opacity:1}
.scelta.riga{flex-direction:row;justify-content:flex-start;gap:12px;min-height:58px;padding:10px 12px;text-align:left;text-transform:none;letter-spacing:0;font:15px var(--corpo);color:var(--testo)}
.scelta.riga b{display:block;font:500 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:inherit}
.scelta.riga small{display:block;color:var(--tenue);font-size:13.5px;line-height:1.35;margin-top:2px}
.scelta.riga .prezzo{margin-left:auto;font:500 12px var(--corpo);color:var(--tenue);white-space:nowrap;align-self:flex-start}
.segmenti{display:flex;background:var(--incasso);border:1px solid var(--bordo);border-radius:10px;padding:3px;gap:3px}
.segmenti button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;
  color:var(--tenue);font:500 11.5px var(--display);letter-spacing:.1em;text-transform:uppercase}
.segmenti button[aria-pressed="true"]{color:var(--oro-luce);border-color:rgba(212,175,55,.55);background:rgba(212,175,55,.1)}
.segmenti button .ic{color:currentColor}

/* cursori */
.cursore{display:grid;grid-template-columns:22px 104px minmax(0,1fr) 50px;align-items:center;gap:9px;margin:8px 0}
.cursore .ic{color:var(--oro)}
.cursore label{font:500 10.5px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);overflow-wrap:anywhere}
.cursore output{text-align:right;font:500 13px var(--corpo);color:var(--crema);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:32px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--oro) var(--p,50%),var(--bordo-forte) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-9.5px;background:#15110a;border:1.5px solid var(--oro);box-shadow:0 0 0 4px rgba(212,175,55,.12)}
input[type=range]::-moz-range-track{height:3px;background:var(--bordo-forte)} input[type=range]::-moz-range-progress{height:3px;background:var(--oro)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#15110a;border:1.5px solid var(--oro)}
.interruttore{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.interruttore .ic{color:var(--oro)}
.interruttore span{flex:1} .interruttore span.tondo{flex:none} .interruttore b{display:block;font-weight:500} .interruttore small{display:block;color:var(--tenue);font-size:13.5px}
.levetta{width:46px;height:28px;border-radius:20px;background:var(--incasso);border:1px solid var(--bordo-forte);position:relative;flex:none;transition:all .2s}
.levetta::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--spento);transition:all .2s}
.interruttore[aria-checked="true"] .levetta{border-color:var(--oro);background:rgba(212,175,55,.15)}
.interruttore[aria-checked="true"] .levetta::after{left:21px;background:var(--oro-luce)}

/* campi */
.campo{display:block;margin:10px 0}
.campo > span{display:block;margin-bottom:6px;font:500 11.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
.campo input,.campo textarea,.campo select,.cerca input{width:100%;background:var(--incasso);border:1px solid var(--bordo);border-radius:10px;padding:12px 13px;color:var(--testo);outline:none;transition:border-color .18s}
.campo input:focus,.campo textarea:focus,.cerca input:focus{border-color:var(--filo-forte)}
.campo select{font:inherit;font-size:15px;-webkit-appearance:none;appearance:none}
.stanze{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bordo)}
.campo textarea{min-height:92px;resize:vertical;line-height:1.4}
.chiave{position:relative} .chiave input{padding-right:48px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.chiave button{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--tenue);cursor:pointer;display:grid;place-items:center}
.cerca{position:relative} .cerca .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--oro);pointer-events:none}
.cerca input{padding-left:42px}
.pillole{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pillola{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;border-radius:999px;border:1px solid var(--bordo-forte);background:rgba(0,0,0,.25);color:var(--crema);font-size:14px;cursor:pointer}
.pillola[aria-pressed="true"]{border-color:var(--oro);color:var(--oro-luce);background:rgba(212,175,55,.1)}
.pillola .ic{color:var(--oro)}

/* anteprima dal vivo */
.anteprima{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--bordo);box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02)}
.anteprima iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:0;transition:opacity .6s}
.anteprima .fermo{position:absolute;background:#000 center/cover no-repeat;pointer-events:none}
.anteprima .etich{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:1px;padding:7px 9px;border-radius:9px;background:rgba(6,8,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06)}
.anteprima .etich b{font:500 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--testo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anteprima .etich small{color:var(--tenue);font:italic 500 14px var(--libro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vivo{display:flex;gap:14px;align-items:stretch}
.vivo .anteprima{flex:0 0 40%;margin:0}
.vivo .rapide{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.rapide .btn{justify-content:flex-start;min-height:52px}
.rapide .btn small{margin-left:auto;font:italic 500 14px var(--libro);text-transform:none;letter-spacing:0;color:var(--tenue)}

/* griglia dei paesaggi */
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.carta{position:relative;padding:0;border:1px solid var(--bordo);border-radius:10px;overflow:hidden;background:var(--incasso);cursor:pointer;text-align:left;transition:border-color .2s,transform .2s,box-shadow .2s;color:var(--testo)}
.carta:active{transform:scale(.98)}
.carta img{display:block;width:100%;aspect-ratio:2/5;object-fit:cover;background:#000}
.carta .su{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;background:linear-gradient(180deg,transparent,rgba(6,8,12,.92))}
.carta .su b{display:block;font:500 11.5px/1.25 var(--display);letter-spacing:.06em;color:var(--testo)}
.carta .su small{display:flex;gap:4px;align-items:center;margin-top:3px;color:var(--tenue);font-size:11.5px}
.carta .su small .ic{color:var(--oro)}
.carta[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 1px rgba(212,175,55,.35),0 10px 24px rgba(0,0,0,.4)}
.carta .inonda{position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:99px;background:rgba(6,8,12,.75);font:500 9.5px var(--display);letter-spacing:.12em;color:var(--live)}
.carta .inonda i{width:6px;height:6px;border-radius:9px;background:var(--live);box-shadow:0 0 6px var(--live)}
.vuoto{grid-column:1/-1;padding:28px 10px;text-align:center;font:italic 500 18px var(--libro);color:var(--tenue)}

/* foglio dal basso */
.velo{position:fixed;inset:0;background:rgba(2,3,5,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.aperto{opacity:1;pointer-events:auto}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--notte);border-top:1px solid var(--filo-forte);border-radius:18px 18px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s cubic-bezier(.16,1,.3,1);box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.foglio.aperto{transform:none}
.foglio .maniglia{width:42px;height:4px;border-radius:4px;background:var(--bordo-forte);margin:4px auto 12px}
.foglio-dentro{max-width:560px;margin:0 auto}
.chiudi-foglio{position:absolute;right:10px;top:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bordo);background:rgba(0,0,0,.3);color:var(--tenue);display:grid;place-items:center;cursor:pointer}
.dettaglio{display:flex;gap:14px}
.dettaglio .grande{flex:0 0 38%;position:relative}
.dettaglio .grande img{width:100%;aspect-ratio:2/5;object-fit:cover;border-radius:10px;border:1px solid var(--bordo);background:#000;display:block}
.dettaglio .info{flex:1;min-width:0}
.dettaglio h3{margin:2px 0 4px;font:500 17px/1.25 var(--display);letter-spacing:.1em;text-transform:uppercase}
.luci{display:flex;gap:6px;margin:10px 0}
.luci button{flex:1;padding:0;border:1px solid var(--bordo);border-radius:7px;overflow:hidden;background:#000;cursor:pointer;position:relative;color:var(--crema)}
.luci button img{display:block;width:100%;aspect-ratio:2/5;object-fit:cover}
.luci button span{position:absolute;inset:auto 0 0;padding:2px 0;background:rgba(6,8,12,.8);font:500 8.5px var(--display);letter-spacing:.08em;text-align:center;color:var(--crema)}
.luci button[aria-pressed="true"]{border-color:var(--oro)}
.luci .manca{display:grid;place-items:center;color:var(--spento);aspect-ratio:2/5;border:1px dashed var(--bordo);border-radius:7px;flex:1}
.azioni{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* passi di un lavoro lungo */
.passi{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.passi li{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--tenue)}
.passi li .ic{color:var(--spento)}
.passi li.ora{color:var(--testo)} .passi li.ora .ic{color:var(--oro);animation:gira 1.4s linear infinite}
.passi li.fatto{color:var(--ok)} .passi li.fatto .ic{color:var(--ok)}
.passi li.errore{color:var(--no)} .passi li.errore .ic{color:var(--no)}
@keyframes gira{to{transform:rotate(360deg)}}
.barra-av{height:3px;border-radius:3px;background:var(--bordo);overflow:hidden;margin-top:8px}
.barra-av i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--oro-luce));transition:width .4s}
.anteprime{display:flex;gap:8px;margin-top:12px}
.anteprime figure{margin:0;flex:1;position:relative;max-width:25%}
.anteprime img{width:100%;aspect-ratio:2/5;object-fit:cover;border-radius:8px;border:1px solid var(--bordo);background:#000;display:block;transition:opacity .3s}
.membri{list-style:none;margin:0;padding:0}
.azioni-riga{display:flex;gap:6px}
.altra-via{margin-top:12px}
.altra-via summary{cursor:pointer;color:var(--tenue);font-size:14px;padding:6px 0}
.benvenuto h3{font:500 17px var(--display);letter-spacing:.06em;margin:14px 0 6px}
.passi-guida{display:flex;gap:6px;flex-wrap:wrap}
.passi-guida span{font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--bordo);color:var(--tenue);display:inline-flex;gap:4px;align-items:center}
.passi-guida span.ora{border-color:var(--oro);color:var(--oro)}
.passi-guida span.fatto{color:var(--oro);opacity:.7}
.mirino{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4;margin-top:10px}
.mirino video{width:100%;height:100%;object-fit:cover;display:block}
.mirino i{position:absolute;inset:18% 14%;border:2px solid var(--oro);border-radius:12px;pointer-events:none}
.mirino span{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#ddd;font-size:13px}
.vecchio-link{margin-top:12px;padding:10px 12px;border:1px solid var(--bordo);border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.vecchio-link b{display:flex;gap:6px;align-items:center}
.membri li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bordo)}
.membri li span{display:flex;flex-direction:column}
.membri small{color:var(--tenue);font-size:12px}
.anteprime.tv{flex-wrap:wrap}
.anteprime.tv figure{flex:1 1 45%;max-width:50%}
.anteprime.tv img{aspect-ratio:16/9}
.anteprime figcaption{text-align:center;margin-top:4px;font:500 9.5px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}

/* stili di pittura: quadretti */
.stili{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stile{padding:0;border:1px solid var(--bordo);border-radius:10px;overflow:hidden;background:var(--incasso);cursor:pointer;text-align:left;color:var(--testo)}
.stile .tela{height:64px;position:relative}
.stile b{display:block;padding:8px 9px 2px;font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase}
.stile small{display:block;padding:0 9px 9px;font-size:12px;line-height:1.3;color:var(--tenue)}
.stile[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 1px rgba(212,175,55,.3)}
.stile[aria-pressed="true"] b{color:var(--oro-luce)}

/* barra in basso */
nav.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--barra);padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;
  background:linear-gradient(180deg,rgba(11,15,22,.86),rgba(6,8,12,.97));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bordo)}
nav.barra .dentro{display:flex;width:100%;max-width:560px}
nav.barra button{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:none;cursor:pointer;position:relative;
  color:var(--spento);font:500 9px var(--display);letter-spacing:.05em;min-width:0;text-transform:uppercase;transition:color .2s}
nav.barra button[aria-current="page"]{color:var(--oro-luce)}
nav.barra button[aria-current="page"]::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:2px;border-radius:2px;background:var(--oro);box-shadow:0 0 12px var(--oro)}

/* avvisi */
.avviso{position:fixed;left:16px;right:16px;bottom:calc(var(--barra) + 14px);z-index:60;max-width:528px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
  background:#15110a;border:1px solid var(--filo-forte);color:var(--testo);box-shadow:0 12px 30px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none}
.avviso.su{transform:none;opacity:1}
.avviso .ic{color:var(--oro)} .avviso.male{border-color:rgba(224,138,138,.5)} .avviso.male .ic{color:var(--no)}
.problema{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(232,121,96,.55);background:linear-gradient(180deg,rgba(232,121,96,.12),rgba(232,121,96,.04))}
.problema .ic{color:var(--live);margin-top:2px}
.problema b{display:block;font:500 12.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--live)}
.problema span{display:block;font-size:14.5px;color:var(--testo);margin-top:3px}
.problema a.btn{text-decoration:none}
.errore-box{margin-top:10px;padding:10px 12px;border-radius:9px;border:1px solid rgba(224,138,138,.35);background:rgba(224,138,138,.06);color:var(--no);font-size:14px}
.credito{font-size:12px;color:var(--spento);margin-top:6px}
code.link{display:block;padding:10px;border-radius:8px;background:var(--incasso);border:1px solid var(--bordo);font-size:12px;word-break:break-all;color:var(--tenue)}
/* 4.0 · più semplice: gruppi apribili, vento a scelte, ricerca con «Aggiungi», miniatura del TV */
details.gruppo{margin-top:12px;border:1px solid var(--bordo);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,0)),var(--pannello)}
details.gruppo > summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 14px;cursor:pointer;font:500 12.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--oro-luce)}
details.gruppo > summary::-webkit-details-marker{display:none}
details.gruppo > summary .ic{color:var(--oro)}
details.gruppo > summary small{font:italic 500 15px var(--libro);letter-spacing:0;text-transform:none;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
details.gruppo > summary::after{content:'';flex:none;width:8px;height:8px;border-right:1.5px solid var(--tenue);border-bottom:1.5px solid var(--tenue);transform:rotate(45deg);margin:-4px 2px 0 6px;transition:transform .2s}
details.gruppo > summary > span{flex:1;min-width:0}
details.gruppo[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
details.gruppo .dentro-gruppo{padding:2px 14px 14px;border-top:1px solid var(--bordo)}
details.gruppo .pannello{background:var(--incasso)}
details.gruppo .campo > span{margin-top:6px}
.blocco{margin:12px 0}
.blocco > span{display:block;margin-bottom:6px;font:500 11.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
.gruppo .scelte.c4 .scelta{font-size:9.5px;letter-spacing:.03em;padding:8px 2px}
.riga-vento{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;gap:6px 9px;margin:10px 0 2px}
.riga-vento .segmenti{grid-column:1/-1}
.riga-vento .ic{color:var(--oro)}
.riga-vento > span{font:500 10.5px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--tenue)}
.riga-vento .segmenti button{min-height:38px;font-size:10.5px;letter-spacing:.08em}
.riga-cerca{display:flex;gap:8px;align-items:stretch}
.riga-cerca .cerca{flex:1;min-width:0}
.riga-cerca .btn{flex:none}
.foglio-titolo{font:500 16px var(--display);letter-spacing:.12em;text-transform:uppercase;margin:4px 0 12px}
.tv-mini{display:block;position:relative;width:100%;padding:0;margin-top:4px;border:1px solid var(--bordo);border-radius:7px;overflow:hidden;background:#000;cursor:pointer}
.tv-mini img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.tv-mini span{position:absolute;left:4px;bottom:4px;display:flex;gap:4px;align-items:center;padding:2px 6px;border-radius:99px;background:rgba(6,8,12,.8);font:500 9px var(--display);letter-spacing:.1em;color:var(--crema)}
.tv-mini[aria-pressed="true"]{border-color:var(--oro)}
/* 4.1 · Bard */
.dove-suona{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:10px 12px;border:1px solid var(--bordo);border-radius:10px;background:var(--incasso);font-size:14px;color:var(--crema)}
.dove-suona .ic{color:var(--oro)} .dove-suona span{flex:1;min-width:0} .dove-suona b{color:var(--oro-luce);font-weight:500}
.suoni{display:flex;flex-wrap:wrap;gap:8px}
.suono{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--bordo-forte);background:rgba(0,0,0,.25);color:var(--crema);font-size:14.5px;cursor:pointer}
.suono[aria-pressed="true"]{border-color:var(--oro);color:var(--oro-luce);background:rgba(212,175,55,.12);box-shadow:0 0 0 1px rgba(212,175,55,.2)}
.comandi-musica{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.comandi-musica .btn{flex:1}
.brani{display:flex;flex-direction:column;border:1px solid var(--bordo);border-radius:10px;overflow:hidden}
.brano{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:0;border-bottom:1px solid var(--bordo);background:var(--incasso);color:var(--crema);font-size:14.5px;text-align:left;cursor:pointer}
.brano:last-child{border-bottom:0} .brano .ic{color:var(--spento)}
.brano[aria-pressed="true"]{color:var(--oro-luce);background:rgba(212,175,55,.08)} .brano[aria-pressed="true"] .ic{color:var(--live)}
.scelta.suona{border-color:var(--live);color:var(--live)}
.ordine{display:flex;flex-direction:column;border:1px solid var(--bordo);border-radius:10px;overflow:hidden}
.riga-scontro{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:4px 10px;padding:10px 12px;border:0;border-bottom:1px solid var(--bordo);background:var(--incasso);color:var(--crema);text-align:left;font-size:15px;cursor:pointer;position:relative}
.riga-scontro:last-child{border-bottom:0} .riga-scontro.pg{cursor:default;opacity:.85} .riga-scontro:disabled{color:var(--crema)}
.riga-scontro .ini{font:600 15px var(--display);color:var(--tenue);text-align:center} .riga-scontro .pf{font-size:13px;color:var(--tenue);white-space:nowrap}
.riga-scontro.turno{background:rgba(212,175,55,.1);box-shadow:inset 3px 0 0 var(--oro)} .riga-scontro.turno .nome{color:var(--oro-luce)}
.riga-scontro.aterra .nome{text-decoration:line-through;color:var(--spento)}
.riga-scontro .barra{grid-column:2/-1;height:3px;border-radius:3px;background:var(--bordo);overflow:hidden;display:block} .riga-scontro .barra b{display:block;height:100%;background:var(--live)}
.scheda-tel .numeri{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.scheda-tel .numeri span{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 10px;border:1px solid var(--bordo);border-radius:9px;background:var(--incasso)}
.scheda-tel .numeri small{font:500 9.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)} .scheda-tel .numeri b{font:600 16px var(--corpo);color:var(--crema)}
.scheda-tel .descr{margin:0;font:italic 500 16.5px/1.4 var(--libro);color:var(--crema)}
.appunti,.da-leggere{margin:0;white-space:pre-line;font-size:15px;line-height:1.5;color:var(--crema)} .da-leggere{font:italic 500 17px/1.45 var(--libro)}
.suono.atmosfera{border-color:rgba(212,175,55,.45);color:var(--oro-luce)} .suono .ic{display:inline;vertical-align:-2px;color:var(--oro)}
#s-bard.in-serata:not([data-console]) .sezione{opacity:.5}
.scelta{position:relative} .scelta .tasto{position:absolute;top:4px;left:6px;font:600 10px ui-monospace,monospace;font-style:normal;color:var(--oro)}

/* 2/11 · i medaglioni dipinti (bozze B, D, E): pulsanti come la console della serata di DMaster */
.med{display:block;flex:none}
.pads{display:grid;gap:4px 2px}
.pads.c5{grid-template-columns:repeat(5,minmax(0,1fr))} .pads.c6{grid-template-columns:repeat(6,minmax(0,1fr))} .pads.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pad{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 4px;border:0;border-radius:10px;background:transparent;color:var(--tenue);font:500 10.5px/1.15 var(--corpo);cursor:pointer;min-width:0}
.pad > span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.pad .tondo{display:block;border-radius:999px;line-height:0;transition:box-shadow .2s}
.pad[aria-pressed="true"]{background:rgba(212,175,55,.12);color:var(--oro-luce)}
.pad[aria-pressed="true"] .tondo{box-shadow:0 0 10px rgba(240,203,91,.7)}
.pad:active .tondo{transform:scale(.94)}
.pad .tasto{position:absolute;top:1px;left:4px;z-index:1;font:600 9px ui-monospace,monospace;font-style:normal;color:var(--oro);background:rgba(7,9,14,.85);border-radius:4px;padding:0 3px}
.suono.con-med{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px}
.riga-med{display:flex;align-items:center;gap:12px;padding:10px 0}
.riga-med + .riga-med{border-top:1px solid var(--filo)}
.riga-med .tondo{display:block;border-radius:999px;line-height:0}
.riga-med.su .tondo{box-shadow:0 0 10px rgba(240,203,91,.6)}
.riga-med .cosa{flex:1;min-width:0}
.riga-med .cosa small{display:block;font:500 10.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.riga-med .cosa b{display:block;margin-top:2px;font:500 17px/1.25 var(--libro);color:var(--testo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riga-med .cosa b.spento{font-style:italic;color:var(--tenue)}
/* l'ingresso (bozza E) */
body.su-ingresso nav.barra{display:none}
body.su-ingresso main{padding-bottom:28px}
.ingresso-testa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 16px;text-align:center}
.ingresso-testa .fili{display:flex;align-items:center;gap:12px;width:100%}
.ingresso-testa .fili i{flex:1;height:1px;background:var(--filo-forte)}
.ingresso-testa h1{margin:0;font:500 22px/1.25 var(--display);letter-spacing:.16em;color:var(--oro)}
.ingresso-testa p{margin:0;font-size:11px;letter-spacing:.08em;color:var(--spento)}
.in-onda-ora{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--pannello);border:1px solid var(--bordo);border-radius:14px}
.in-onda-ora .foto{width:58px;height:58px;border-radius:999px;border:1.6px solid var(--oro);object-fit:cover;flex:none;background:var(--incasso)}
.in-onda-ora .cosa{min-width:0;flex:1}
.in-onda-ora .stato{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tenue)}
.in-onda-ora .stato i{width:7px;height:7px;border-radius:999px;background:var(--spento)} .in-onda-ora .stato.viva{color:var(--ok)} .in-onda-ora .stato.viva i{background:var(--ok)}
.in-onda-ora b{display:block;margin-top:2px;font:500 19px/1.2 var(--libro);color:var(--testo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in-onda-ora small{display:block;font:italic 500 15px/1.3 var(--libro);color:var(--tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voci-ingresso{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.voce-ingresso{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--bordo);border-radius:14px;background:var(--notte);color:var(--testo);text-align:left;cursor:pointer;width:100%}
.voce-ingresso:active{border-color:var(--oro)}
.voce-ingresso .cosa{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.voce-ingresso .cosa b{font:500 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--oro)}
.voce-ingresso .cosa small{font:italic 500 16px/1.3 var(--libro);color:var(--tenue)}
.voce-ingresso .ic{color:var(--spento)}
.testa .torna{flex:none;width:36px;height:36px;margin:0 2px 0 -8px;border:0;background:none;color:var(--tenue);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:999px}
.testa .torna:active{color:var(--oro)}
.testa .torna{align-self:center} .testa .torna + div{flex:1}
/* 8/11 · tre schede: sulle schede principali niente freccia, l'ingranaggio porta alle Impostazioni */
.testa .ingranaggio{flex:none;width:38px;height:38px;margin-left:8px;border:1px solid var(--filo-forte,rgba(212,175,55,.45));border-radius:999px;background:var(--oro-veste);color:var(--oro-luce);display:flex;align-items:center;justify-content:center;cursor:pointer;align-self:center}
.testa .ingranaggio:active{transform:scale(.96)}
body.principale .testa .torna{display:none}
#s-impostazioni .testa .ingranaggio{display:none}
.ingresso-testa h1{text-transform:uppercase}

/* 3/11 · le anteprime della stanza: TV e finestrelle affiancati, alti uguali */
.stanza-mini{display:flex;gap:8px;align-items:flex-start}
/* 8/11 · il paesaggio in onda grande (il TV) con le finestrelle nell'angolo */
.eroe{position:relative;cursor:pointer;border-radius:14px}
.eroe #anteprimaTv{width:100%;margin:0;flex:none;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.eroe #anteprima{position:absolute;top:8px;right:8px;height:62%;width:auto;flex:none!important;margin:0;border-radius:8px;border-color:rgba(212,175,55,.55);box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:2}
.eroe-testo{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:28px 12px 10px;border-radius:0 0 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));pointer-events:none;display:flex;flex-direction:column;gap:1px}
.eroe-testo b{font:500 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--crema);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eroe-testo small{font:italic 500 15px var(--libro);color:var(--tenue)}
.stanza-mini .anteprima{margin:0;min-width:0;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.anteprima.tv{aspect-ratio:16/9;flex:1.7778 1 0}
.anteprima figcaption{position:absolute;left:6px;bottom:5px;font:500 9.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--crema);background:rgba(6,8,12,.62);padding:2px 6px;border-radius:6px;pointer-events:none}
.in-onda-riga{display:flex;align-items:baseline;gap:8px;margin:10px 2px 0;min-width:0}
.in-onda-riga b{font:500 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--testo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:60%}
.in-onda-riga small{font:italic 500 15px var(--libro);color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rapide.in-riga{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rapide.in-riga .btn{justify-content:center;min-height:46px;padding:0 8px;gap:6px;letter-spacing:.06em;min-width:0}
@media (max-width:380px){ .rapide.in-riga .btn{font-size:11px} .rapide.in-riga .btn .ic{width:17px;height:17px} }
@media (max-width: 400px){ .testa h1{font-size:19px;letter-spacing:.14em} .testa p{font-size:16.5px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main id="app"></main>
<nav class="barra" aria-label="Sezioni"><div class="dentro" id="barra"></div></nav>
<div class="velo" id="velo"></div>
<div class="foglio" id="foglio" role="dialog" aria-modal="true"><div class="maniglia"></div><button class="chiudi-foglio" data-fai="chiudiFoglio" aria-label="Chiudi" id="chiudiFoglio"></button><div class="foglio-dentro" id="foglioDentro"></div></div>
<div class="avviso" id="avviso" role="status"></div>

<script src="../js/supabase.js?v=2.1.0"></script>
<script src="../js/canale.js?v=2.2.0"></script>
<script src="../js/icone.js?v=2.4.0"></script>
<script src="../js/medaglioni.js?v=1"></script>
<script src="../js/accesso.js?v=8"></script>
<script src="../js/libreria.js?v=2.9"></script>
<script src="../js/ai.js?v=2.9"></script>
<script src="../js/fermo.js?v=2"></script>
<script src="../js/foto-online.js?v=2.1.0"></script>
<script src="../js/profondita.js?v=2.1.0"></script>

<script src="app.js?v=6.4"></script>
</body>
