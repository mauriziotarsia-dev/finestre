<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finestre">
<link rel="apple-touch-icon" href="icona.png">
<link rel="icon" href="icona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<title>Finestre</title>
<style>
/* Lo stile di DMaster Stage (styles/tokens.css, stile-casa.css): ardesia scura, un solo accento,
   l'oro, a filo; titoli in Cinzel spaziato, righe di contorno in corsivo da libro, testo in Inter;
   icone disegnate a filo. Il corallo solo per «sta succedendo adesso». */
:root{
  color-scheme: dark;
  --bg:#06080c; --notte:#0b0f16; --pannello:#121822; --rialzo:#1a2230; --incasso:#080b12;
  --bordo:#2a2e38; --bordo-forte:#3d4250; --filo:rgba(212,175,55,.16); --filo-forte:rgba(212,175,55,.5);
  --oro:#d4af37; --oro-luce:#f0cb5b; --oro-veste:rgba(212,175,55,.12);
  --testo:#e8dcc0; --crema:#d9cfb6; --tenue:#a69b82; --spento:#6b6555;
  --live:#e87960; --ok:#8fd08f; --no:#e08a8a;
  --display:'Cinzel','Trajan Pro',Georgia,serif; --libro:'Cormorant Garamond',Georgia,serif;
  --corpo:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --barra:calc(66px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--testo);font:16px/1.45 var(--corpo);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%, #111826 0%, var(--bg) 60%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(212,175,55,.32);color:#fff6dc}
.ic{display:block;flex:none}

main{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(var(--barra) + 24px)}
.scheda{display:none}
.scheda.attiva{display:block;animation:entra .28s cubic-bezier(.16,1,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* testata di pagina, come la home di DMaster */
.testa{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 12px;margin-bottom:16px;
  border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(212,175,55,.45),rgba(212,175,55,.04)) 1}
.testa h1{margin:0;font:500 21px/1.1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--testo);display:flex;align-items:center;gap:10px}
.testa h1 .ic{color:var(--oro)}
.testa p{margin:5px 0 0;font:italic 500 18px/1.3 var(--libro);color:var(--crema)}
.spia{display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--spento);white-space:nowrap;padding-bottom:3px}
.spia i{width:7px;height:7px;border-radius:9px;background:var(--spento)}
.spia.viva{color:var(--live)} .spia.viva i{background:var(--live);box-shadow:0 0 8px var(--live)}

/* sezioni */
.sezione{margin-top:18px}
.titolo{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:500 12.5px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--oro-luce)}
.titolo .ic{color:var(--oro)}
.titolo small{margin-left:auto;font:italic 500 15px var(--libro);letter-spacing:0;text-transform:none;color:var(--tenue)}
.pannello{background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,0)),var(--pannello);border:1px solid var(--bordo);border-radius:12px;padding:14px}
.nota{font:italic 500 16px/1.35 var(--libro);color:var(--tenue);margin:8px 0 0}
.nota a{color:var(--oro)}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:8px;cursor:pointer;
  background:rgba(0,0,0,.28);border:1px solid var(--bordo-forte);color:var(--crema);font:500 12.5px var(--display);letter-spacing:.1em;text-transform:uppercase;
  transition:border-color .18s,color .18s,background .18s,transform .12s}
.btn:active{transform:scale(.98)}
.btn .ic{color:var(--oro)}
.btn.oro{background:linear-gradient(180deg,rgba(212,175,55,.3),rgba(212,175,55,.16)),#15110a;color:var(--oro-luce);border-color:rgba(212,175,55,.75);box-shadow:0 4px 18px rgba(212,175,55,.12);font-weight:600}
.btn.oro .ic{color:var(--oro-luce)}
.btn.piena{width:100%}
.btn.piccolo{min-height:36px;padding:6px 10px;font-size:11.5px}
.btn.pericolo{color:var(--no);border-color:rgba(224,138,138,.35)} .btn.pericolo .ic{color:var(--no)}
.btn:disabled{opacity:.4;cursor:default}

/* scelte (stato acceso: oro + velo + anello, mai pieno) */
.scelte{display:grid;gap:8px}
.scelte.c5{grid-template-columns:repeat(5,1fr)} .scelte.c3{grid-template-columns:repeat(3,1fr)} .scelte.c2{grid-template-columns:repeat(2,1fr)} .scelte.c4{grid-template-columns:repeat(4,1fr)}
.scelta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;padding:8px 4px;border-radius:10px;cursor:pointer;
  background:var(--incasso);border:1px solid var(--bordo);color:var(--tenue);font:500 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:center;transition:all .18s}
.scelta .ic{color:var(--crema);opacity:.85}
.scelta[aria-pressed="true"]{color:var(--oro-luce);border-color:var(--oro);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.04));box-shadow:0 0 0 1px rgba(212,175,55,.2)}
.scelta[aria-pressed="true"] .ic{color:var(--oro-luce);opacity:1}
.scelta.riga{flex-direction:row;justify-content:flex-start;gap:12px;min-height:58px;padding:10px 12px;text-align:left;text-transform:none;letter-spacing:0;font:15px var(--corpo);color:var(--testo)}
.scelta.riga b{display:block;font:500 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:inherit}
.scelta.riga small{display:block;color:var(--tenue);font-size:13.5px;line-height:1.35;margin-top:2px}
.scelta.riga .prezzo{margin-left:auto;font:500 12px var(--corpo);color:var(--tenue);white-space:nowrap;align-self:flex-start}
.segmenti{display:flex;background:var(--incasso);border:1px solid var(--bordo);border-radius:10px;padding:3px;gap:3px}
.segmenti button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;
  color:var(--tenue);font:500 11.5px var(--display);letter-spacing:.1em;text-transform:uppercase}
.segmenti button[aria-pressed="true"]{color:var(--oro-luce);border-color:rgba(212,175,55,.55);background:rgba(212,175,55,.1)}
.segmenti button .ic{color:currentColor}

/* cursori */
.cursore{display:grid;grid-template-columns:22px 104px minmax(0,1fr) 50px;align-items:center;gap:9px;margin:8px 0}
.cursore .ic{color:var(--oro)}
.cursore label{font:500 10.5px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);overflow-wrap:anywhere}
.cursore output{text-align:right;font:500 13px var(--corpo);color:var(--crema);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:32px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--oro) var(--p,50%),var(--bordo-forte) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-9.5px;background:#15110a;border:1.5px solid var(--oro);box-shadow:0 0 0 4px rgba(212,175,55,.12)}
input[type=range]::-moz-range-track{height:3px;background:var(--bordo-forte)} input[type=range]::-moz-range-progress{height:3px;background:var(--oro)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#15110a;border:1.5px solid var(--oro)}
.interruttore{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.interruttore .ic{color:var(--oro)}
.interruttore span{flex:1} .interruttore b{display:block;font-weight:500} .interruttore small{display:block;color:var(--tenue);font-size:13.5px}
.levetta{width:46px;height:28px;border-radius:20px;background:var(--incasso);border:1px solid var(--bordo-forte);position:relative;flex:none;transition:all .2s}
.levetta::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--spento);transition:all .2s}
.interruttore[aria-checked="true"] .levetta{border-color:var(--oro);background:rgba(212,175,55,.15)}
.interruttore[aria-checked="true"] .levetta::after{left:21px;background:var(--oro-luce)}

/* campi */
.campo{display:block;margin:10px 0}
.campo > span{display:block;margin-bottom:6px;font:500 11.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
.campo input,.campo textarea,.cerca input{width:100%;background:var(--incasso);border:1px solid var(--bordo);border-radius:10px;padding:12px 13px;color:var(--testo);outline:none;transition:border-color .18s}
.campo input:focus,.campo textarea:focus,.cerca input:focus{border-color:var(--filo-forte)}
.campo textarea{min-height:92px;resize:vertical;line-height:1.4}
.chiave{position:relative} .chiave input{padding-right:48px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.chiave button{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--tenue);cursor:pointer;display:grid;place-items:center}
.cerca{position:relative} .cerca .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--oro);pointer-events:none}
.cerca input{padding-left:42px}
.pillole{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pillola{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;border-radius:999px;border:1px solid var(--bordo-forte);background:rgba(0,0,0,.25);color:var(--crema);font-size:14px;cursor:pointer}
.pillola[aria-pressed="true"]{border-color:var(--oro);color:var(--oro-luce);background:rgba(212,175,55,.1)}
.pillola .ic{color:var(--oro)}

/* anteprima dal vivo */
.anteprima{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--bordo);box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02)}
.anteprima iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.anteprima .etich{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:1px;padding:7px 9px;border-radius:9px;background:rgba(6,8,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06)}
.anteprima .etich b{font:500 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--testo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anteprima .etich small{color:var(--tenue);font:italic 500 14px var(--libro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vivo{display:flex;gap:14px;align-items:stretch}
.vivo .anteprima{flex:0 0 40%;margin:0}
.vivo .rapide{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.rapide .btn{justify-content:flex-start;min-height:52px}
.rapide .btn small{margin-left:auto;font:italic 500 14px var(--libro);text-transform:none;letter-spacing:0;color:var(--tenue)}

/* griglia dei paesaggi */
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.carta{position:relative;padding:0;border:1px solid var(--bordo);border-radius:10px;overflow:hidden;background:var(--incasso);cursor:pointer;text-align:left;transition:border-color .2s,transform .2s,box-shadow .2s;color:var(--testo)}
.carta:active{transform:scale(.98)}
.carta img{display:block;width:100%;aspect-ratio:2/5;object-fit:cover;background:#000}
.carta .su{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;background:linear-gradient(180deg,transparent,rgba(6,8,12,.92))}
.carta .su b{display:block;font:500 11.5px/1.25 var(--display);letter-spacing:.06em;color:var(--testo)}
.carta .su small{display:flex;gap:4px;align-items:center;margin-top:3px;color:var(--tenue);font-size:11.5px}
.carta .su small .ic{color:var(--oro)}
.carta[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 1px rgba(212,175,55,.35),0 10px 24px rgba(0,0,0,.4)}
.carta .inonda{position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:99px;background:rgba(6,8,12,.75);font:500 9.5px var(--display);letter-spacing:.12em;color:var(--live)}
.carta .inonda i{width:6px;height:6px;border-radius:9px;background:var(--live);box-shadow:0 0 6px var(--live)}
.vuoto{grid-column:1/-1;padding:28px 10px;text-align:center;font:italic 500 18px var(--libro);color:var(--tenue)}

/* foglio dal basso */
.velo{position:fixed;inset:0;background:rgba(2,3,5,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.aperto{opacity:1;pointer-events:auto}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--notte);border-top:1px solid var(--filo-forte);border-radius:18px 18px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s cubic-bezier(.16,1,.3,1);box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.foglio.aperto{transform:none}
.foglio .maniglia{width:42px;height:4px;border-radius:4px;background:var(--bordo-forte);margin:4px auto 12px}
.foglio-dentro{max-width:560px;margin:0 auto}
.chiudi-foglio{position:absolute;right:10px;top:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bordo);background:rgba(0,0,0,.3);color:var(--tenue);display:grid;place-items:center;cursor:pointer}
.dettaglio{display:flex;gap:14px}
.dettaglio .grande{flex:0 0 38%;position:relative}
.dettaglio .grande img{width:100%;aspect-ratio:2/5;object-fit:cover;border-radius:10px;border:1px solid var(--bordo);background:#000;display:block}
.dettaglio .info{flex:1;min-width:0}
.dettaglio h3{margin:2px 0 4px;font:500 17px/1.25 var(--display);letter-spacing:.1em;text-transform:uppercase}
.luci{display:flex;gap:6px;margin:10px 0}
.luci button{flex:1;padding:0;border:1px solid var(--bordo);border-radius:7px;overflow:hidden;background:#000;cursor:pointer;position:relative;color:var(--crema)}
.luci button img{display:block;width:100%;aspect-ratio:2/5;object-fit:cover}
.luci button span{position:absolute;inset:auto 0 0;padding:2px 0;background:rgba(6,8,12,.8);font:500 8.5px var(--display);letter-spacing:.08em;text-align:center;color:var(--crema)}
.luci button[aria-pressed="true"]{border-color:var(--oro)}
.luci .manca{display:grid;place-items:center;color:var(--spento);aspect-ratio:2/5;border:1px dashed var(--bordo);border-radius:7px;flex:1}
.azioni{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* passi di un lavoro lungo */
.passi{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.passi li{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--tenue)}
.passi li .ic{color:var(--spento)}
.passi li.ora{color:var(--testo)} .passi li.ora .ic{color:var(--oro);animation:gira 1.4s linear infinite}
.passi li.fatto{color:var(--ok)} .passi li.fatto .ic{color:var(--ok)}
.passi li.errore{color:var(--no)} .passi li.errore .ic{color:var(--no)}
@keyframes gira{to{transform:rotate(360deg)}}
.barra-av{height:3px;border-radius:3px;background:var(--bordo);overflow:hidden;margin-top:8px}
.barra-av i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--oro-luce));transition:width .4s}
.anteprime{display:flex;gap:8px;margin-top:12px}
.anteprime figure{margin:0;flex:1;position:relative;max-width:25%}
.anteprime img{width:100%;aspect-ratio:2/5;object-fit:cover;border-radius:8px;border:1px solid var(--bordo);background:#000;display:block;transition:opacity .3s}
.anteprime figcaption{text-align:center;margin-top:4px;font:500 9.5px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}

/* stili di pittura: quadretti */
.stili{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stile{padding:0;border:1px solid var(--bordo);border-radius:10px;overflow:hidden;background:var(--incasso);cursor:pointer;text-align:left;color:var(--testo)}
.stile .tela{height:64px;position:relative}
.stile b{display:block;padding:8px 9px 2px;font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase}
.stile small{display:block;padding:0 9px 9px;font-size:12px;line-height:1.3;color:var(--tenue)}
.stile[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 1px rgba(212,175,55,.3)}
.stile[aria-pressed="true"] b{color:var(--oro-luce)}

/* barra in basso */
nav.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--barra);padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;
  background:linear-gradient(180deg,rgba(11,15,22,.86),rgba(6,8,12,.97));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bordo)}
nav.barra .dentro{display:flex;width:100%;max-width:560px}
nav.barra button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:none;cursor:pointer;position:relative;
  color:var(--spento);font:500 9.5px var(--display);letter-spacing:.14em;text-transform:uppercase;transition:color .2s}
nav.barra button[aria-current="page"]{color:var(--oro-luce)}
nav.barra button[aria-current="page"]::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:2px;border-radius:2px;background:var(--oro);box-shadow:0 0 12px var(--oro)}

/* avvisi */
.avviso{position:fixed;left:16px;right:16px;bottom:calc(var(--barra) + 14px);z-index:60;max-width:528px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
  background:#15110a;border:1px solid var(--filo-forte);color:var(--testo);box-shadow:0 12px 30px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none}
.avviso.su{transform:none;opacity:1}
.avviso .ic{color:var(--oro)} .avviso.male{border-color:rgba(224,138,138,.5)} .avviso.male .ic{color:var(--no)}
.errore-box{margin-top:10px;padding:10px 12px;border-radius:9px;border:1px solid rgba(224,138,138,.35);background:rgba(224,138,138,.06);color:var(--no);font-size:14px}
.credito{font-size:12px;color:var(--spento);margin-top:6px}
code.link{display:block;padding:10px;border-radius:8px;background:var(--incasso);border:1px solid var(--bordo);font-size:12px;word-break:break-all;color:var(--tenue)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main id="app"></main>
<nav class="barra" aria-label="Sezioni"><div class="dentro" id="barra"></div></nav>
<div class="velo" id="velo"></div>
<div class="foglio" id="foglio" role="dialog" aria-modal="true"><div class="maniglia"></div><button class="chiudi-foglio" data-fai="chiudiFoglio" aria-label="Chiudi" id="chiudiFoglio"></button><div class="foglio-dentro" id="foglioDentro"></div></div>
<div class="avviso" id="avviso" role="status"></div>

<script src="../js/supabase.js?v=2.0.1"></script>
<script src="../js/canale.js?v=2.0.1"></script>
<script src="../js/icone.js?v=2.0.1"></script>
<script src="../js/libreria.js?v=2.0.1"></script>
<script src="../js/ai.js?v=2.0.1"></script>
<script src="../js/foto-online.js?v=2.0.1"></script>
<script src="../js/profondita.js?v=2.0.1"></script>
<script src="app.js?v=2.0.1"></script>
</body>
</html>
