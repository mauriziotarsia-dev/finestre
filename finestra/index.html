<!doctype html>

<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
  .video{position:absolute;overflow:hidden;background:#000;z-index:1}
  .video iframe{position:absolute;border:0;pointer-events:none}
  .bordo{position:absolute;border:2px dashed #d4af37;pointer-events:none;z-index:3;box-sizing:border-box}
  .bordo span{position:absolute;top:6px;left:8px;font:600 14px system-ui;color:#d4af37}
  /* 31/10 · la TV della Serata: quello che il DM manda in onda copre il paesaggio, e quando lo toglie il paesaggio torna */
  #telo{position:fixed;inset:0;z-index:6;pointer-events:none}
  #telo .strato{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .9s ease}
  #telo .strato.su{opacity:1}
  #telo .fondo{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(40px) brightness(.45);transform:scale(1.05)}
  #telo img,#telo video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

<body>
<canvas id="c"></canvas>
<div id="telo"></div>
<script src="../js/supabase.js?v=2.1.0"></script>
<script src="../js/canale.js?v=2.2.0"></script>
<script src="../js/accesso.js?v=8"></script>
<script src="../js/qrcode.js?v=1"></script>
<script src="../js/vita.js?v=5"></script>
<script src="../js/vista.js?v=5.61"></script>
<script src="../js/inseguitore.js?v=1"></script>
<script src="../js/uccelli.js?v=10"></script>
<script src="../js/bard.js?v=9"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   La pagina che il Raspberry mostra dietro il traforo.
   Indirizzo: ?casa=CODICE   (collega la finestra al telecomando della casa)
   Facoltativi: lato=sinistra|destra (una finestra per uscita), x,y,w,h (un foro, in pixel),
                vista=est (il TV: tutto lo schermo, la vista verso est del paesaggio; tvx, tvy = dove sta il centro
                del TV rispetto al radar, in mm: x verso destra guardando le finestrelle, y verso la stanza),
                anteprima=1 (dentro l'app: niente canale, la scena arriva dalla pagina che la contiene),
                forza=1 (usa i parametri dell'indirizzo anche se c'è una scena memorizzata).
   I fori, la scena e la calibrazione arrivano dal telefono e restano memorizzati qui.
   ═══════════════════════════════════════════════════════════════════════════ */
const q = new URLSearchParams(location.search);
const UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
const casa = (String(q.get('casa') || '').match(UUID) || [null])[0];
const anteprima = q.get('anteprima') === '1';
/* 8/11 · ?guarda=1 (pagina guarda/, Maurizio: «vederle live su una pagina web, senza guardare la TV»): uno spettatore.
   Copia la scena dagli schermi veri (chiede «chi c'è?» e prende quella del suo stesso ruolo), segue scene, lampi e
   comandi come loro, ma non si presenta come schermo, non salva niente, non risponde a stato/foto/banco e non suona. */
const spettatore = q.get('guarda') === '1';
const fpsUrl = +q.get('fps') || 0;      /* uno schermo può avere la sua fluidità (es. &fps=50 se è impostato a 50 Hz) */
const latoUrl = q.get('lato') === 'sinistra' ? -1 : q.get('lato') === 'destra' ? 1 : 0;
const leggi = (k, d) => { if (anteprima || (spettatore && k === 'finestre-scena')) return d; try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const scrivi = (k, v) => { if (anteprima || spettatore) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

/* ── la scena: quello che il telecomando manda ─────────────────────────────── */
const PREDEFINITA = {acceso:true, yt:'', t:0, immagini:null, animati:null, paesaggio:'', ora:'vera', meteo:'sereno',
  intensita:.75, vento:null, nebbiaSale:false, fps:60, fuoco:null, prospettivaViva:false, movimento:true, luceGiorno:70, luceNotte:50, prospettiva:true, zoom:1, vx:0};
let scena = Object.assign({}, PREDEFINITA, leggi('finestre-scena', null) || {});
let saleK = scena.nebbiaSale ? 1 : 0;   /* nebbia che sale: 0 giù, 1 su (ricaricando la pagina resta dov'era) */
if (!leggi('finestre-scena', null) || q.get('forza')){
  if (q.get('yt')) scena.yt = q.get('yt');
  if (q.get('ora')) scena.ora = q.get('ora');
  if (q.get('meteo')) scena.meteo = q.get('meteo');
}

/* ── i fori: dove sono sullo schermo (frazioni dello schermo) e come si dividono il paesaggio ── */
function foroPredefinito(){ const H = .9, W = H * innerHeight * 2 / 5 / innerWidth; return {x:(1 - W) / 2, y:(1 - H) / 2, w:W, h:H}; }
/* Le finestre della casa sono una o due, ognuna sul suo schermo (a due metri l'una dall'altra):
   questa pagina è quella della finestra «sinistra» o «destra» (?lato=…; senza, «sinistra»).
   Il telefono manda {n, finestre:{sinistra:{x,y,w,h}, destra:{…}}}; ogni pagina usa il suo foro. */
/* ⚠ 30/10 · IL TV (Maurizio: TV 65" verso est, in 4K, sincronizzato con le finestrelle: stessa ora, stesso tempo,
   soggetto diverso). La stessa pagina, con ?vista=est: tutto lo schermo è la finestra, mostra la vista «est-…» del
   paesaggio (se non c'è ancora, quella delle finestrelle allargata) e ignora i fori delle finestrelle. */
const tv = q.get('vista') === 'est' || q.get('lato') === 'tv';
const mio = tv ? 'tv' : q.get('lato') === 'destra' ? 'destra' : 'sinistra';
/* il titolo dice chi è (sul Raspberry con due schermi serve a mettere ogni finestra sul suo) */
if (!anteprima) document.title = tv ? 'Illusionist TV' : 'Illusionist finestra ' + mio;
const fraCm = v => v == null || v === '' || isNaN(+v) ? -5 : Math.max(-15, Math.min(15, Math.round(+v)));
function normalizza(a){
  if (a && a.finestre) return {n: a.n === 2 ? 2 : 1, finestre: a.finestre, staccato: Math.max(0, Math.min(30, +a.staccato || 0)), fra: fraCm(a.fra)};
  if (a && a.fori && a.fori.length === 1) return {n:1, finestre:{sinistra:a.fori[0]}};   /* formato di prima */
  return {n:1, finestre:{}};
}
let casaFori = normalizza(leggi('finestre-fori', null));
/* ?sim=… (la stanza simulata, stanza/): il riquadro è tutto foro, la finestra non si calibra */
const simulata = q.get('sim') || '';
/* ⚠ 2/11 · SCHERMO STACCATO DAL MURO (Maurizio: «staccare di una decina di cm lo schermo, allargando l'immagine a tutto
   lo schermo, senza radar; il radar solo per il TV»). Il muro è largo esattamente come il foro (45 × 18 cm), quindi con lo
   schermo appoggiato l'immagine finisce dove finisce il muro: nessuna prospettiva vera. Staccato di N cm, guardando di
   sbieco si vede anche lo schermo intorno al foro: lì il paesaggio deve continuare. Il disegno copre il foro allargato di
   N × 0,7 cm per lato (fino a ~35° di sbieco; oltre, il muro lascia solo una fessura), entro lo schermo. La scala la dà
   il foro calibrato: 45 cm di altezza, 18 di larghezza. Sulle finestrelle staccate il radar non serve più. */
/* 2/11 · la cornice di pietra del traforo lascia un'apertura di circa 14 cm (il foro nel muro dietro è 18): la cornice
   tratteggiata si allinea all'apertura di pietra, quella che si vede di fronte; il paesaggio deve arrivare fino al foro
   del muro (2 cm in più per lato) e oltre, di N × 0,7 cm. Apertura di pietra alta circa 40 cm (Maurizio, 2/11). */
/* ⚠ 7/11 · MISURE NUOVE (Maurizio, corrette la sera stessa): il foro nel muro è 16 × 44 cm, il muro è profondo 16 cm;
   davanti, nella stanza medievale, la pietra del triforo è 1 cm più stretta e più bassa: 15 × 43 cm. In fondo, dove sta lo schermo, il
   foro è 16: il disegno deve coprire 16 × 44 (più N × SBIECO per lato con lo schermo staccato di N cm). */
const PIETRA = {w:15, h:43, fondoW:16, fondoH:44};   /* davanti la pietra del triforo è 1 cm più stretta anche in altezza */
/* 8/11 · lo sbieco massimo che il tunnel lascia passare: bordo della pietra davanti → bordo opposto del foro in fondo,
   (15 + 16) / 2 su 20 cm (4 di pietra + 16 di muro) in larghezza (38°, poi il foro si chiude), (43 + 44) / 2 su 20 in altezza. Prima era 0,7
   (35°): fra 35° e 38° si vedeva il nero oltre il disegno. */
const FORO_CM = {w:PIETRA.fondoW, h:PIETRA.fondoH, muroW:PIETRA.fondoW, muroH:PIETRA.fondoH}, SBIECO = (PIETRA.w + PIETRA.fondoW) / 2 / 20, SBIECO_V = (PIETRA.h + PIETRA.fondoH) / 2 / 20;   /* 20 = 4 di pietra + 16 di muro */
const staccatoCm = () => tv || simulata ? 0 : Math.max(0, Math.min(30, q.get('staccato') != null ? +q.get('staccato') || 0 : +casaFori.staccato || 0));
const radarQui = () => !!(tv || simulata) || !staccatoCm();
function allarga(f){
  const g = staccatoCm(); if (!g) return f;
  const ex = ((FORO_CM.muroW - FORO_CM.w) / 2 + g * SBIECO) * f.w / FORO_CM.w, ey = ((FORO_CM.muroH - FORO_CM.h) / 2 + g * SBIECO_V) * f.h / FORO_CM.h;
  const x0 = Math.max(0, f.x - ex), y0 = Math.max(0, f.y - ey), x1 = Math.min(1, f.x + f.w + ex), y1 = Math.min(1, f.y + f.h + ey);
  return {x:x0, y:y0, w:x1 - x0, h:y1 - y0};
}
/* 4/11 · IL TRUCCO DELLA PROSPETTIVA (Maurizio, bozza C scelta il 4/11): «l'elemento cardine non deve essere mai al centro:
   nella finestrella di sinistra spostato a destra, in quella di destra a sinistra; chi guarda tutte e due da lontano non lo
   vede in tutte e due». Con due finestrelle e un paesaggio largo (16:9) ognuna mostra una striscia diversa dello stesso
   panorama, alto quanto lo schermo: la sinistra a sinistra dell'elemento, la destra a destra. fra = cm di panorama fra le
   due strisce viste di fronte (−5: 5 cm in comune). Di fronte dal foro si vede FRONTE cm per parte (il foro di pietra,
   14 cm, proiettato sullo schermo che sta MURO_PIETRA + staccato cm più indietro, da 2 m). I paesaggi verticali: come prima. */
const MURO_PIETRA = 20, LONTANO = 200;   /* 8/11: 4 cm di pietra del triforo + 16 cm di foro nel muro = 20 dalla faccia della pietra alla fine del muro */
function striscia(f, W, H){
  if (tv) return null;
  /* quanto panorama si vede di fronte (mezza larghezza, in cm sul piano dello schermo): lo decide il più stretto fra
     l'apertura davanti (15, la pietra del triforo, a 2 m) e il foro in fondo (16, a 2 m + 16), proiettati sullo schermo */
  const dS = LONTANO + MURO_PIETRA + (simulata ? 10 : staccatoCm());
  const fronte = Math.min(PIETRA.w / 2 * dS / LONTANO, PIETRA.fondoW / 2 * dS / (LONTANO + MURO_PIETRA));
  /* nella stanza simulata il riquadro è l'apertura vista di fronte, e le finestrelle sono sempre due */
  if (simulata === 'finestra') return {lato: mio === 'destra' ? 1 : -1, u: .5, cmW: 2 * fronte, off: fronte + fraCm(casaFori.fra) / 2};
  /* ?doppia=1: le due finestrelle nello stesso disegno (f.lato già deciso), come nella stanza simulata */
  if (doppiaUrl) return {lato: f.lato, u: .5, cmW: 2 * fronte, off: fronte + fraCm(casaFori.fra) / 2};
  if (simulata || casaFori.n !== 2 || !assetto.buco) return null;
  const b = assetto.buco, bx = b.x * W, bw = b.w * W;
  return {lato: mio === 'destra' ? 1 : -1, u: (bx + bw / 2 - f.x) / f.w, cmW: f.w / bw * FORO_CM.w, off: fronte + fraCm(casaFori.fra) / 2};
}
/* ⚠ 5/11 · ?doppia=1 (Maurizio: «il Pi non deve mandare due immagini diverse alle due finestre: è una sola immagine
   con due porzioni diverse»). Una pagina sola, un disegno solo, le immagini e il video caricati una volta: le due
   finestrelle sono due fori dello stesso disegno, ognuno con la sua striscia del panorama. Con un solo schermo (il Pi
   attaccato al TV) stanno affiancate e un po' separate; con i due schermi veri la finestra del browser li copre entrambi. */
const doppiaUrl = q.get('doppia') === '1' && !tv;
function foriDoppia(){
  const W = innerWidth || 1, H = innerHeight || 1;
  if (W / H > 1.15){   /* un solo schermo largo: due feritoie (16:44, 7/11) alte quasi tutto, separate */
    const h = .94, w = h * H * (FORO_CM.w / FORO_CM.h) / W, gap = Math.min(.06, (1 - 2 * w) / 3);
    const x0 = .5 - gap / 2 - w;
    return [{x:x0, y:.03, w, h}, {x:.5 + gap / 2, y:.03, w, h}];
  }
  return [{x:0, y:0, w:.5, h:1}, {x:.5, y:0, w:.5, h:1}];   /* due schermi verticali affiancati: metà per uno */
}
const derivato = () => {
  if (doppiaUrl) return {modo:'doppia', fori: foriDoppia()};
  if (tv || simulata) return {modo:'singola', fori:[{x:0, y:0, w:1, h:1}]};
  const buco = (casaFori.finestre || {})[mio] || foroPredefinito();
  return {modo:'singola', fori:[allarga(buco)], buco};
};
let assetto = derivato();
if (q.get('w') && q.get('h')) assetto = {modo:'unica', fori:[{x:+q.get('x') / innerWidth, y:+q.get('y') / innerHeight, w:+q.get('w') / innerWidth, h:+q.get('h') / innerHeight}]};
let mostraBordi = false;

const c = document.getElementById('c');
let vista = null;
try { vista = new Vista(c); } catch(e) {
  document.body.innerHTML = '<p style="color:#d4af37;font:20px system-ui;padding:40px">Questa finestra non riesce a usare la grafica (WebGL): ' + e.message + '<br><small>Riprovo da sola fra un minuto.</small></p>';
  /* ⚠ 9/11: il Raspberry è rimasto così ore senza che da lontano si sapesse (non rispondeva e basta). Ora lo dice nello
     stato (finestre/banco/stato-<chi>.json, con il motivo) e riprova da solo ogni minuto */
  try { fetch(SUPABASE_URL + '/storage/v1/object/dmaster-media/finestre/banco/stato-' + mio + '.json', {method: 'POST',
    headers: {apikey: SUPABASE_CHIAVE_PUBBLICA, Authorization: 'Bearer ' + SUPABASE_CHIAVE_PUBBLICA, 'Content-Type': 'image/png', 'x-upsert': 'true'},
    body: JSON.stringify({chi: mio, quando: new Date().toISOString(), errore: 'WebGL: ' + e.message, ua: navigator.userAgent,
      versione: ([...document.scripts].map(x => x.src).find(x => /vista\.js/.test(x)) || '').split('?')[1] || ''})}); } catch(e2) {}
  setTimeout(() => location.reload(), 60000);
  throw e; }

/* ⚠ 5/11 · SCHEDA VIDEO PERSA (Raspberry sul TV: «tutto nero»). Se la scheda video butta via il disegno (memoria finita,
   reset), la pagina non lo ritrova da sola e resta nera: si ricarica dopo 3 s. Al massimo 4 volte in 10 minuti, poi
   resta com'è (così non gira all'infinito se la scheda proprio non regge). */
/* ⚠ 5/11 · sul Raspberry il processo grafico di Chromium si chiudeva per errore subito dopo «Ricarica» (due volte su
   due): si lascia andare prima la grafica e i video, poi si ricarica */
let inRicarica = false;
function ricaricaPulita(){
  if (inRicarica) return; inRicarica = true;
  try { const vv = [...document.querySelectorAll('video')]; (vista ? vista.fonti : []).forEach(f => (f.video || []).forEach(v => vv.push(v)));
    vv.forEach(v => { try { v.pause(); v.removeAttribute('src'); v.load(); } catch(x) {} }); } catch(x) {}
  try { const ext = vista && vista.gl && vista.gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); } catch(x) {}
  setTimeout(() => location.reload(), 400);
}
c.addEventListener('webglcontextlost', e => {
  if (inRicarica) return;
  e.preventDefault();
  let r = []; try { r = JSON.parse(sessionStorage.getItem('finestre-riprese') || '[]').filter(t => Date.now() - t < 600000); } catch(x) {}
  if (r.length >= 4) return;
  r.push(Date.now()); try { sessionStorage.setItem('finestre-riprese', JSON.stringify(r)); } catch(x) {}
  setTimeout(() => location.reload(), 3000);
});

let geom = [];      /* i fori in pixel, con la loro mappa */
let geomGL = [];    /* gli stessi, in pixel del disegno (che può essere più piccolo dello schermo) */
/* risoluzione dinamica: se il computer fatica, il disegno si fa più piccolo e lo schermo lo ingrandisce;
   quando torna fluido, risale. Su un Raspberry con due schermi da 24" fa la differenza */
let scala = 1, scalaFissa = 0;   /* scalaFissa: solo per le prove da lontano */
/* ⚠ 5/11 · RISOLUZIONE FISSA DEL DISEGNO (Maurizio: «non si spengono effetti, abbassiamo la risoluzione; quando cambieremo
   device saremo già pronti alzandola»). &disegno=576: ogni finestrella si disegna alta 576 punti, qualunque sia lo
   schermo (sul TV di prova come sui 27" verticali), e lo schermo la ingrandisce; niente scala automatica. Pi 4, banco
   del 4/11: 576 (0,3 di un Full HD verticale) tiene le due finestrelle a 30 al secondo. Apparecchio nuovo: &disegno=1920
   (o toglierlo: torna la scala automatica). */
const disegnoUrl = Math.max(0, Math.min(4320, +q.get('disegno') || 0));
function impagina(){
  const W = Math.round(innerWidth), H = Math.round(innerHeight);
  const px = assetto.fori.map(f => ({x:Math.round(f.x * W), y:Math.round(f.y * H), w:Math.max(2, Math.round(f.w * W)), h:Math.max(2, Math.round(f.h * H))}));
  const ux = Math.min(...px.map(f => f.x)), uy = Math.min(...px.map(f => f.y));
  const uw = Math.max(...px.map(f => f.x + f.w)) - ux, uh = Math.max(...px.map(f => f.y + f.h)) - uy;
  /* ⚠ 30/10: il disegno copre solo i fori, non tutto lo schermo. Su uno schermo 4K la tela intera (anche
     dimezzata) costava più del paesaggio: 25 immagini al secondo, uccelli a scatti */
  /* ⚠ 30/10 · TV 4K: su Windows lo schermo 4K è «ingrandito» (150-300%) e la pagina vede 1280-2560 pixel di larghezza
     invece di 3840: il disegno va fatto in pixel veri dello schermo, non in quelli della pagina */
  if (disegnoUrl){ const hMax = Math.max(...px.map(f => f.h)) * Math.min(4, devicePixelRatio || 1);
    scala = scalaFissa = Math.max(.1, Math.min(1, disegnoUrl / Math.max(1, hMax))); }
  const k = scala * Math.min(anteprima ? 2 : 4, devicePixelRatio || 1);
  const CW = Math.max(2, Math.round(uw * k)), CH = Math.max(2, Math.round(uh * k));
  if (c.width !== CW || c.height !== CH){ c.width = CW; c.height = CH; }
  Object.assign(c.style, {left: ux + 'px', top: uy + 'px', width: uw + 'px', height: uh + 'px', right: 'auto', bottom: 'auto'});
  const ordine = px.map((f, i) => [f.x, i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const zoom = Math.max(1, scena.zoom || 1), vx = scena.vx || 0;
  geom = px.map((f, i) => {
    let map, aspetto, lato;
    if (assetto.modo === 'singola'){
      /* la finestra di questo schermo: il paesaggio intero, con la prospettiva del suo lato se le finestre sono due */
      map = [0, 0, 1, 1]; aspetto = f.w / f.h; lato = tv ? 0 : casaFori.n === 2 ? (mio === 'destra' ? 1 : -1) : latoUrl;
    } else if (assetto.modo === 'doppia' && px.length > 1){
      /* ogni foro ha il paesaggio intero, con la sua prospettiva: sinistra e destra */
      map = [0, 0, 1, 1]; aspetto = f.w / f.h; lato = ordine.indexOf(i) === 0 ? -1 : 1;
    } else {
      /* un paesaggio solo dietro tutti i fori, come una vista vera divisa dalla colonnina */
      map = [(f.x - ux) / uw, (f.y - uy) / uh, f.w / uw, f.h / uh]; aspetto = uw / uh; lato = px.length > 1 ? 0 : latoUrl;
    }
    /* ingrandimento e spostamento dal telefono */
    map = [.5 + (map[0] - .5) / zoom + vx, .5 + (map[1] - .5) / zoom, map[2] / zoom, map[3] / zoom];
    return Object.assign(f, {map, aspetto, lato, striscia: assetto.modo === 'singola' ? striscia(f, W, H) : doppiaUrl ? striscia(Object.assign({}, f, {lato}), W, H) : null});
  });
  geom.unione = {x:ux, y:uy, w:uw, h:uh};
  geomGL = geom.map(f => { const x = Math.round((f.x - ux) * k), y = Math.round((f.y - uy) * k);
    return Object.assign({}, f, {x, y, w:Math.max(2, Math.round((f.x - ux + f.w) * k) - x), h:Math.max(2, Math.round((f.y - uy + f.h) * k) - y)}); });
  disegnaBordi(); impaginaVideo();
}
addEventListener('resize', () => { if (doppiaUrl) assetto = derivato(); impagina(); });

function disegnaBordi(){
  document.querySelectorAll('.bordo').forEach(e => e.remove());
  if (!mostraBordi) return;
  const W = innerWidth, H = innerHeight, b = assetto.buco && staccatoCm() ? assetto.buco : null;
  (b ? [{x:b.x * W, y:b.y * H, w:b.w * W, h:b.h * H}] : geom).forEach((f, i) => { const d = document.createElement('div'); d.className = 'bordo';

function iframeYT(id, t){

function mettiVideo(id, t){
  document.querySelectorAll('.video').forEach(e => e.remove());
  if (id){
    const n = assetto.modo === 'doppia' && geom.length > 1 ? geom.length : 1;
    for (let i = 0; i < n; i++){ const v = document.createElement('div'); v.className = 'video'; v.appendChild(iframeYT(id, t)); document.body.appendChild(v); }

function impaginaVideo(){
  const scatole = [...document.querySelectorAll('.video')];

  const zoom = Math.max(1, scena.zoom || 1);
  const metti = (box, r, fori) => {
    Object.assign(box.style, {left:r.x + 'px', top:r.y + 'px', width:r.w + 'px', height:r.h + 'px'});
    /* il riquadro del video copre il rettangolo con un 15% in più (via titolo e loghi), 16:9 */
    let vh = r.h * 1.15 * zoom, vw = vh * 16 / 9;
    if (vw < r.w * 1.15 * zoom){ vw = r.w * 1.15 * zoom; vh = vw * 9 / 16; }
    const sposta = (scena.vx || 0) * vw;
    Object.assign(box.firstChild.style, {width:vw + 'px', height:vh + 'px', left:((r.w - vw) / 2 - sposta) + 'px', top:((r.h - vh) / 2) + 'px'});
    box.style.clipPath = 'path("' + fori.map(f => `M${f.x - r.x} ${f.y - r.y}h${f.w}v${f.h}h${-f.w}z`).join(' ') + '")';
  };

     simili»): l'alba senza video suo prende quello del tramonto (luce bassa e calda, lo stesso movimento), la notte
     quello del giorno. Del video si prende solo il movimento: colori e dettagli restano del dipinto di quell'ora */

  /* 13/11: in un interno niente cielo che scorre, niente alberi al vento, niente fumo dai comignoli */

let avvisatoPronta = null, paesaggioInVista = null, inCambio = false, attesa = null, scuroVerso = 1, scuro = 1, assettoVideo = null;

   «spento» lo toglie e torna il paesaggio. Durante un intermezzo (un video che si guarda una volta) le
   finestrelle si abbassano un po'. A fine intermezzo il TV dice «tvFine», e DMaster spegne la 📺. */
let intermezzoQui = false, coperto = false, proiezione = {id:null, chiave:null};
const scuroDi = () => scena.acceso ? (intermezzoQui ? .55 : 0) : 1;
const telo = document.getElementById('telo');
function suTv(d, rispondi){

}
function togliProiezione(){
  proiezione = {id:null, chiave:null}; coperto = false;
  for (const v of telo.querySelectorAll('.strato')){ v.classList.remove('su'); const m = v.querySelector('video'); setTimeout(() => { if (m) { m.pause(); m.removeAttribute('src'); m.load(); } v.remove(); }, 1000); }

async function mettiProiezione(d, rispondi){
  const chiave = d.video || d.immagine;

      v.addEventListener('ended', () => { if (!d.loop && proiezione.id === d.id){ rispondi && rispondi('tvFine', {id:d.id}); togliProiezione(); } });
      strato.appendChild(v);

      /* con l'audio Chrome vuole un gesto, se non è avviato con --autoplay-policy=no-user-gesture-required: allora parte muto */
      await v.play().catch(() => { v.muted = true; return v.play(); });

      await img.decode();

      strato.appendChild(f); strato.appendChild(img);

    return;
  }

  const vecchi = [...telo.querySelectorAll('.strato')];

  requestAnimationFrame(() => requestAnimationFrame(() => strato.classList.add('su')));
  setTimeout(() => { if (proiezione.id === d.id){ coperto = true; for (const v of vecchi){ const m = v.querySelector('video'); if (m) m.pause(); v.remove(); } } }, 1000);
}

function intensitaLampo(ora){
  if (!lampo) return 0;
  const dt = ora - lampo.t;
  if (!lampo.imp){   /* (forma vecchia: per le prove) */
    if (dt > 1400){ lampo = null; return 0; }
    return (dt < 70 ? 1 : dt < 140 ? .12 : dt < 210 ? .8 : dt < 300 ? .18 : dt < 360 ? .55 : Math.max(0, .45 * (1 - (dt - 360) / 1040))) * lampo.forza;
  }
  if (dt > lampo.coda + lampo.durCoda){ lampo = null; return 0; }
  /* gli impulsi del lampo, con un filo di luce fra uno e l'altro, poi la coda che si spegne */
  const x = (dt - lampo.coda) / lampo.durCoda;
  let k = dt < lampo.coda ? .06 : .3 * (1 - x) * (1 - x);
  for (const i of lampo.imp) if (dt >= i.da && dt < i.a) k = Math.max(k, i.k);
  return Math.max(0, k) * lampo.forza;
}

/* ⚠ 2/11: il radar si monta accanto al TV, rivolto verso la stanza (le finestrelle staccate non lo usano più).
   Allora per il TV vale lo stesso conto delle finestrelle. Il vecchio montaggio (radar dietro una finestrella,
