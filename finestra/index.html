<!doctype html>
<html lang="it" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMaster Atmosphere · Illusionist</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
  .video{position:absolute;overflow:hidden;background:#000;z-index:1}
  .video iframe{position:absolute;border:0;pointer-events:none}
  .bordo{position:absolute;border:2px dashed #d4af37;pointer-events:none;z-index:3;box-sizing:border-box}
  .bordo span{position:absolute;top:6px;left:8px;font:600 14px system-ui;color:#d4af37}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/supabase.js?v=2.1.0"></script>
<script src="../js/canale.js?v=2.2.0"></script>
<script src="../js/accesso.js?v=3"></script>
<script src="../js/qrcode.js?v=1"></script>
<script src="../js/vista.js?v=4.3"></script>
<script src="../js/inseguitore.js?v=1"></script>
<script src="../js/uccelli.js?v=3"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   La pagina che il Raspberry mostra dietro il traforo.
   Indirizzo: ?casa=CODICE   (collega la finestra al telecomando della casa)
   Facoltativi: lato=sinistra|destra (una finestra per uscita), x,y,w,h (un foro, in pixel),
                vista=est (il TV: tutto lo schermo, la vista verso est del paesaggio; tvx, tvy = dove sta il centro
                del TV rispetto al radar, in mm: x verso destra guardando le finestrelle, y verso la stanza),
                anteprima=1 (dentro l'app: niente canale, la scena arriva dalla pagina che la contiene),
                forza=1 (usa i parametri dell'indirizzo anche se c'è una scena memorizzata).
   I fori, la scena e la calibrazione arrivano dal telefono e restano memorizzati qui.
   ═══════════════════════════════════════════════════════════════════════════ */
const q = new URLSearchParams(location.search);
const UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
const casa = (String(q.get('casa') || '').match(UUID) || [null])[0];
const anteprima = q.get('anteprima') === '1';
const fpsUrl = +q.get('fps') || 0;      /* uno schermo può avere la sua fluidità (es. &fps=50 se è impostato a 50 Hz) */
const latoUrl = q.get('lato') === 'sinistra' ? -1 : q.get('lato') === 'destra' ? 1 : 0;
const leggi = (k, d) => { if (anteprima) return d; try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const scrivi = (k, v) => { if (anteprima) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

/* ── la scena: quello che il telecomando manda ─────────────────────────────── */
const PREDEFINITA = {acceso:true, yt:'', t:0, immagini:null, animati:null, paesaggio:'', ora:'vera', meteo:'sereno',
  intensita:.75, vento:null, fps:60, fuoco:null, prospettivaViva:false, movimento:true, luceGiorno:70, luceNotte:30, prospettiva:true, zoom:1, vx:0};
let scena = Object.assign({}, PREDEFINITA, leggi('finestre-scena', null) || {});
if (!leggi('finestre-scena', null) || q.get('forza')){
  if (q.get('yt')) scena.yt = q.get('yt');
  if (q.get('ora')) scena.ora = q.get('ora');
  if (q.get('meteo')) scena.meteo = q.get('meteo');
}

/* ── i fori: dove sono sullo schermo (frazioni dello schermo) e come si dividono il paesaggio ── */
function foroPredefinito(){ const H = .9, W = H * innerHeight * 2 / 5 / innerWidth; return {x:(1 - W) / 2, y:(1 - H) / 2, w:W, h:H}; }
/* Le finestre della casa sono una o due, ognuna sul suo schermo (a due metri l'una dall'altra):
   questa pagina è quella della finestra «sinistra» o «destra» (?lato=…; senza, «sinistra»).
   Il telefono manda {n, finestre:{sinistra:{x,y,w,h}, destra:{…}}}; ogni pagina usa il suo foro. */
/* ⚠ 30/10 · IL TV (Maurizio: TV 65" verso est, in 4K, sincronizzato con le finestrelle: stessa ora, stesso tempo,
   soggetto diverso). La stessa pagina, con ?vista=est: tutto lo schermo è la finestra, mostra la vista «est-…» del
   paesaggio (se non c'è ancora, quella delle finestrelle allargata) e ignora i fori delle finestrelle. */
const tv = q.get('vista') === 'est' || q.get('lato') === 'tv';
const mio = tv ? 'tv' : q.get('lato') === 'destra' ? 'destra' : 'sinistra';
/* il titolo dice chi è (sul Raspberry con due schermi serve a mettere ogni finestra sul suo) */
if (!anteprima) document.title = tv ? 'Illusionist TV' : 'Illusionist finestra ' + mio;
function normalizza(a){
  if (a && a.finestre) return {n: a.n === 2 ? 2 : 1, finestre: a.finestre};
  if (a && a.fori && a.fori.length === 1) return {n:1, finestre:{sinistra:a.fori[0]}};   /* formato di prima */
  return {n:1, finestre:{}};
}
let casaFori = normalizza(leggi('finestre-fori', null));
const derivato = () => tv ? {modo:'singola', fori:[{x:0, y:0, w:1, h:1}]} : ({modo:'singola', fori:[(casaFori.finestre || {})[mio] || foroPredefinito()]});
let assetto = derivato();
if (q.get('w') && q.get('h')) assetto = {modo:'unica', fori:[{x:+q.get('x') / innerWidth, y:+q.get('y') / innerHeight, w:+q.get('w') / innerWidth, h:+q.get('h') / innerHeight}]};
let mostraBordi = false;

const c = document.getElementById('c');
let vista = null;
try { vista = new Vista(c); } catch(e) { document.body.innerHTML = '<p style="color:#d4af37;font:20px system-ui;padding:40px">Questa finestra non riesce a usare la grafica (WebGL): ' + e.message + '</p>'; throw e; }

let geom = [];      /* i fori in pixel, con la loro mappa */
let geomGL = [];    /* gli stessi, in pixel del disegno (che può essere più piccolo dello schermo) */
/* risoluzione dinamica: se il computer fatica, il disegno si fa più piccolo e lo schermo lo ingrandisce;
   quando torna fluido, risale. Su un Raspberry con due schermi da 24" fa la differenza */
let scala = 1, scalaFissa = 0;   /* scalaFissa: solo per le prove da lontano */
function impagina(){
  const W = Math.round(innerWidth), H = Math.round(innerHeight);
  const px = assetto.fori.map(f => ({x:Math.round(f.x * W), y:Math.round(f.y * H), w:Math.max(2, Math.round(f.w * W)), h:Math.max(2, Math.round(f.h * H))}));
  const ux = Math.min(...px.map(f => f.x)), uy = Math.min(...px.map(f => f.y));
  const uw = Math.max(...px.map(f => f.x + f.w)) - ux, uh = Math.max(...px.map(f => f.y + f.h)) - uy;
  /* ⚠ 30/10: il disegno copre solo i fori, non tutto lo schermo. Su uno schermo 4K la tela intera (anche
     dimezzata) costava più del paesaggio: 25 immagini al secondo, uccelli a scatti */
  /* ⚠ 30/10 · TV 4K: su Windows lo schermo 4K è «ingrandito» (150-300%) e la pagina vede 1280-2560 pixel di larghezza
     invece di 3840: il disegno va fatto in pixel veri dello schermo, non in quelli della pagina */
  const k = scala * Math.min(anteprima ? 2 : 4, devicePixelRatio || 1);
  const CW = Math.max(2, Math.round(uw * k)), CH = Math.max(2, Math.round(uh * k));
  if (c.width !== CW || c.height !== CH){ c.width = CW; c.height = CH; }
  Object.assign(c.style, {left: ux + 'px', top: uy + 'px', width: uw + 'px', height: uh + 'px', right: 'auto', bottom: 'auto'});
  const ordine = px.map((f, i) => [f.x, i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const zoom = Math.max(1, scena.zoom || 1), vx = scena.vx || 0;
  geom = px.map((f, i) => {
    let map, aspetto, lato;
    if (assetto.modo === 'singola'){
      /* la finestra di questo schermo: il paesaggio intero, con la prospettiva del suo lato se le finestre sono due */
      map = [0, 0, 1, 1]; aspetto = f.w / f.h; lato = tv ? 0 : casaFori.n === 2 ? (mio === 'destra' ? 1 : -1) : latoUrl;
    } else if (assetto.modo === 'doppia' && px.length > 1){
      /* ogni foro ha il paesaggio intero, con la sua prospettiva: sinistra e destra */
      map = [0, 0, 1, 1]; aspetto = f.w / f.h; lato = ordine.indexOf(i) === 0 ? -1 : 1;
    } else {
      /* un paesaggio solo dietro tutti i fori, come una vista vera divisa dalla colonnina */
      map = [(f.x - ux) / uw, (f.y - uy) / uh, f.w / uw, f.h / uh]; aspetto = uw / uh; lato = px.length > 1 ? 0 : latoUrl;
    }
    /* ingrandimento e spostamento dal telefono */
    map = [.5 + (map[0] - .5) / zoom + vx, .5 + (map[1] - .5) / zoom, map[2] / zoom, map[3] / zoom];
    return Object.assign(f, {map, aspetto, lato});
  });
  geom.unione = {x:ux, y:uy, w:uw, h:uh};
  geomGL = geom.map(f => { const x = Math.round((f.x - ux) * k), y = Math.round((f.y - uy) * k);
    return Object.assign({}, f, {x, y, w:Math.max(2, Math.round((f.x - ux + f.w) * k) - x), h:Math.max(2, Math.round((f.y - uy + f.h) * k) - y)}); });
  disegnaBordi(); impaginaVideo();
}
addEventListener('resize', impagina);

function disegnaBordi(){
  document.querySelectorAll('.bordo').forEach(e => e.remove());
  if (!mostraBordi) return;
  geom.forEach((f, i) => { const d = document.createElement('div'); d.className = 'bordo';
    Object.assign(d.style, {left:f.x + 'px', top:f.y + 'px', width:f.w + 'px', height:f.h + 'px'});
    d.innerHTML = '<span>' + (tv ? 'TV' : casaFori.n === 2 ? 'Finestra ' + mio : 'Finestra') + '</span>'; document.body.appendChild(d); });
}

/* ── i video di YouTube: sotto il disegno, ritagliati sui fori ─────────────── */
function iframeYT(id, t){
  const fr = document.createElement('iframe'); fr.allow = 'autoplay; encrypted-media';
  fr.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&mute=1&loop=1&playlist=' + encodeURIComponent(id) +
    '&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&playsinline=1&rel=0' + (t ? '&start=' + (+t) : '');
  return fr;
}
function mettiVideo(id, t){
  document.querySelectorAll('.video').forEach(e => e.remove());
  if (id){
    const n = assetto.modo === 'doppia' && geom.length > 1 ? geom.length : 1;
    for (let i = 0; i < n; i++){ const v = document.createElement('div'); v.className = 'video'; v.appendChild(iframeYT(id, t)); document.body.appendChild(v); }
  }
  impaginaVideo();
}
function impaginaVideo(){
  const scatole = [...document.querySelectorAll('.video')];
  if (!scatole.length || !geom.length) return;
  const zoom = Math.max(1, scena.zoom || 1);
  const metti = (box, r, fori) => {
    Object.assign(box.style, {left:r.x + 'px', top:r.y + 'px', width:r.w + 'px', height:r.h + 'px'});
    /* il riquadro del video copre il rettangolo con un 15% in più (via titolo e loghi), 16:9 */
    let vh = r.h * 1.15 * zoom, vw = vh * 16 / 9;
    if (vw < r.w * 1.15 * zoom){ vw = r.w * 1.15 * zoom; vh = vw * 9 / 16; }
    const sposta = (scena.vx || 0) * vw;
    Object.assign(box.firstChild.style, {width:vw + 'px', height:vh + 'px', left:((r.w - vw) / 2 - sposta) + 'px', top:((r.h - vh) / 2) + 'px'});
    box.style.clipPath = 'path("' + fori.map(f => `M${f.x - r.x} ${f.y - r.y}h${f.w}v${f.h}h${-f.w}z`).join(' ') + '")';
  };
  if (scatole.length > 1) scatole.forEach((b, i) => metti(b, geom[i], [geom[i]]));
  else metti(scatole[0], geom.unione, geom);
}

/* ── scena in vista ────────────────────────────────────────────────────────── */
function oraDi(s){ return s.ora === 'vera' ? oraVera() : s.ora; }
/* le immagini della vista di questo schermo: sul TV quelle «est-…», se il paesaggio le ha */
function vistaDi(s){
  const est = tv && s.immagini && s.immagini['est-giorno'];
  if (!est) return {im: s.immagini || {}, an: s.animati || {}};
  const im = {}, an = {};
  for (const k in s.immagini) if (k.startsWith('est-')) im[k.slice(4)] = s.immagini[k];
  for (const k of ['giorno','alba','tramonto','notte']) if (s.immagini['cielo-' + k]) im['cielo-' + k] = s.immagini['cielo-' + k];   /* lo stesso cielo delle finestrelle */
  for (const k in (s.animati || {})) if (k.startsWith('est-')) an[k.slice(4)] = s.animati[k];
  return {im, an};
}
function fonteDi(s){
  if (!s.immagini || s.yt) return null;
  const {im, an} = vistaDi(s);
  s = Object.assign({}, s, {immagini: im, animati: an});
  const o = oraDi(s), url = s.immagini[o] || s.immagini.giorno;
  if (!url) return null;
  const video = an[o] || (!s.immagini[o] || o === 'giorno' ? an.giorno : null) || null;
  /* il cielo che scorre: quello della luce che si vede; se la scena non lo porta (da DMaster, per esempio)
     si prova il file con lo stesso nome (…_alba.jpg → …_cielo-alba.jpg): se non c'è, niente */
  const oraUsata = s.immagini[o] ? o : 'giorno';
  const cielo = s.immagini['cielo-' + oraUsata] || (/_(giorno|alba|tramonto|notte)\.jpg$/.test(url.split('?')[0]) ? url.split('?')[0].replace(/_(giorno|alba|tramonto|notte)\.jpg$/, '_cielo-$1.jpg') : null);
  /* video appena fatto, non ancora cucito dal Raspberry: il suo paesaggio fermo e dove si muove (js/fermo.js).
     Anche qui, se la scena non li porta, si provano i file con lo stesso nome del video */
  let fermo = null, maschera = null;
  if (video){
    const m = video.split('?')[0].match(/_((?:est-)?)anim-(giorno|alba|tramonto|notte)\.mp4$/), oraV = m && m[2], pre = m ? m[1] : '';
    if (oraV){
      fermo = s.immagini['fermo-' + oraV] || video.split('?')[0].replace(/_(?:est-)?anim-\w+\.mp4$/, '_' + pre + 'fermo-' + oraV + '.jpg');
      maschera = s.immagini['maschera-' + oraV] || video.split('?')[0].replace(/_(?:est-)?anim-\w+\.mp4$/, '_' + pre + 'maschera-' + oraV + '.png');
    }
  }
  return {url, profondita: s.immagini.profondita || null, video, fuoco: s.fuoco || null, cielo: s.immagini.profondita ? cielo : null, fermo, maschera};
}
function chiaveFonte(f){ return f ? f.url + '|' + (f.video || '') : null; }
function paesaggioDi(s){ return s.yt ? 'yt:' + s.yt + ':' + (s.t || 0) : s.immagini ? 'img:' + (s.paesaggio || s.immagini.giorno) : 'niente'; }

let paesaggioInVista = null, inCambio = false, attesa = null, scuroVerso = 1, scuro = 1, assettoVideo = null;
function applica(nuova, salva = true){
  scena = Object.assign({}, PREDEFINITA, nuova);
  if (salva) scrivi('finestre-scena', scena);
  if (paesaggioDi(scena) !== paesaggioInVista){
    /* paesaggio nuovo: si spegne, cambia, si riaccende */
    inCambio = true; scuroVerso = 1; clearTimeout(attesa);
    const mio = paesaggioDi(scena);
    attesa = setTimeout(async () => {
      if (mio !== paesaggioDi(scena)) return;
      paesaggioInVista = mio;
      mettiVideo(scena.yt, scena.t);
      const f = fonteDi(scena);
      try { if (f) await vista.mostra(f, 0); else vista.togli(); } catch(e) { console.warn(e); }
      impagina();
      setTimeout(() => { scuroVerso = scena.acceso ? 0 : 1; inCambio = false; }, scena.yt ? 1800 : 150);
    }, 950);
  } else {
    /* stesso paesaggio: se cambia l'ora la luce sfuma in pochi secondi */
    const f = fonteDi(scena);
    if (f && vista.urlInVista && vista.urlInVista !== chiaveFonte(f)) vista.mostra(f, 3.5).catch(console.warn);
    else if (f && vista.fonti[0].ok) vista.fonti[0].fuoco = f.fuoco;
    scuroVerso = scena.acceso ? 0 : 1;
    impagina();
  }
}

/* ── tempo atmosferico, lampi, luce ────────────────────────────────────────── */
const METEO = {
  sereno:   {coperto:0,   nebbia:0,   pioggia:0, neve:0, tempesta:0, vento:.2},
  nuvoloso: {coperto:.55, nebbia:.08, pioggia:0, neve:0, tempesta:0, vento:.35},
  nebbia:   {coperto:.4,  nebbia:.85, pioggia:0, neve:0, tempesta:0, vento:.05},
  pioggia:  {coperto:.85, nebbia:.22, pioggia:.8, neve:0, tempesta:.15, vento:.45},
  temporale:{coperto:1,   nebbia:.18, pioggia:1, neve:0, tempesta:1, vento:.9},
  neve:     {coperto:.75, nebbia:.3,  pioggia:0, neve:.9, tempesta:0, vento:.2}
};
const NEBBIA_ORA = {alba:[.86,.74,.68], giorno:[.74,.77,.8], tramonto:[.78,.6,.52], notte:[.09,.11,.16]};
const met = Object.assign({}, METEO.sereno), nebCol = [...NEBBIA_ORA.giorno];
const stormi = new Stormi();
let notte = 0, ombre = 0, meteora = null, prossimaMeteora = 0;
let fpsMisurati = 60, uccelli = 0, cieloX = Math.random(), notteFinta = 0, luce = .7, lampo = null, prossimoLampo = 0, lampoX = .5;

function scocca(){ lampo = {t:performance.now(), forza:.75 + Math.random() * .5}; lampoX = .15 + Math.random() * .7; }
function intensitaLampo(ora){
  if (!lampo) return 0;
  const dt = ora - lampo.t; if (dt > 1400){ lampo = null; return 0; }
  /* due o tre impulsi, come un lampo vero, poi la coda che si spegne */
  const k = dt < 70 ? 1 : dt < 140 ? .12 : dt < 210 ? .8 : dt < 300 ? .18 : dt < 360 ? .55 : Math.max(0, .45 * (1 - (dt - 360) / 1040));
  return k * lampo.forza;
}

/* ── prospettiva viva: le finestre seguono chi si muove nella stanza ─────────────
   Il sensore (radar HLK-LD2450 dietro il traforo) è letto sul Raspberry da pi/sensore.py, che lo
   offre qui come flusso di eventi su http://localhost:8787/persone. Funziona per una persona sola:
   con nessuno o con più persone l'immagine torna ferma, piano. Dal telefono si può provare a mano. */
/* ⚠ riordino del 30/10 · TEMPO REALE (obiettivo di Maurizio: al massimo 80 ms). Prima la posizione
   arrivava 10 volte al secondo e la si seguiva «a molla» (mezzo secondo per arrivare a due terzi):
   adesso ogni lettura del radar arriva appena c'è, con l'età misurata dal ricevitore, e passa per
   l'Inseguitore (js/inseguitore.js): ferma da fermi, pronta in movimento, e a ogni immagine disegna
   dove sarai fra un attimo. La molla resta solo per tornare al centro quando non c'è nessuno. */
const occhio = {x:0, z:0}, occhioTgt = {x:0, z:0};
const inseguitore = new Inseguitore(q.get('anticipo') ? {anticipo: +q.get('anticipo') / 1000} : {});
let margine = 1.04, provaFino = 0, sensore = null, ultimoSensore = 0, ultimaPresenza = 0;
const misura = {n:0, t0:0, eta:0, intervallo:0, ultimo:0};
const TV_POS = {x: +q.get('tvx') || 2600, y: +q.get('tvy') || 1800};   /* da misurare sabato (pianta della stanza) */
function verso(x, y){
  /* il TV è a 90° dalle finestrelle: chi va verso le finestrelle (y più piccolo) per il TV va a sinistra,
     chi va verso il TV (x più grande) gli si avvicina */
  if (tv){
    const d = Math.max(300, TV_POS.x - x), ang = Math.atan2(y - TV_POS.y, d);
    return {x: Math.max(-1, Math.min(1, ang / (Math.PI / 4))), z: Math.max(-1, Math.min(1, (2600 - d) / 1600))};
  }
  /* x in mm a destra-sinistra del sensore, y in mm di distanza: angolo di vista e vicinanza */
  const ang = Math.atan2(x, y);
  return {x: Math.max(-1, Math.min(1, ang / (Math.PI / 4))), z: Math.max(-1, Math.min(1, (2600 - y) / 1600))};
}
function daPersone(lista, etaMs = 0){
  const ora = performance.now();
  ultimoSensore = ora;
  if (ora < provaFino) return;                       /* sta provando il telefono: il radar aspetta */
  const p = (lista || []).filter(x => x && x.y > 200);
  if (p.length !== 1){ occhioTgt.x = 0; occhioTgt.z = 0; return; }
  const v = verso(p[0].x, p[0].y), quando = ora - Math.max(0, etaMs || 0);
  inseguitore.campione(v.x, v.z, quando / 1000);
  ultimaPresenza = ora;
  if (misura.ultimo){ misura.intervallo = misura.intervallo * .9 + (quando - misura.ultimo) * .1; }
  misura.ultimo = quando; misura.eta = misura.eta * .9 + (etaMs || 0) * .1; misura.n++;
}
/* la prova dal telefono passa dallo stesso inseguitore */
/* ?misura=1: in un angolo, quante letture arrivano, ogni quanto, e quanto sono vecchie quando arrivano */
const misuraVisibile = q.get('misura') === '1';
let cartellino = null;
function mostraMisura(){
  if (!cartellino){ cartellino = document.createElement('div'); cartellino.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;font:13px/1.4 monospace;color:#9f9;background:rgba(0,0,0,.7);padding:6px 9px;border-radius:6px;pointer-events:none'; document.body.appendChild(cartellino); }
  const p = inseguitore.posizione(performance.now() / 1000);
  cartellino.textContent = `radar: ${misura.intervallo ? (1000 / misura.intervallo).toFixed(1) : '—'} letture/s · ogni ${misura.intervallo.toFixed(0)} ms · età all'arrivo ${misura.eta.toFixed(0)} ms · anticipo ${(inseguitore.o.anticipo * 1000).toFixed(0)} ms` + (p ? ` · x ${p.x.toFixed(2)} z ${p.z.toFixed(2)}` : '');
}
function daTelefono(x, z){ provaFino = performance.now() + 8000; inseguitore.campione(+x || 0, +z || 0, performance.now() / 1000); ultimaPresenza = performance.now(); }
function apriSensore(){
  if (sensore || anteprima) return;
  try {
    sensore = new EventSource('http://localhost:8788/persone');
    sensore.onmessage = e => { try { const d = JSON.parse(e.data); daPersone(d.persone, d.eta_ms); } catch(x) {} };
    sensore.onerror = () => { sensore.close(); sensore = null; setTimeout(() => { if (scena.prospettivaViva) apriSensore(); }, 15000); };
  } catch(e) { sensore = null; }
}
function chiudiSensore(){ if (sensore){ sensore.close(); sensore = null; } }

/* ── collegamento ──────────────────────────────────────────────────────────── */
function calibra(d){
  const prima = JSON.stringify(assetto.modo) + assetto.fori.length;
  if (d.finestre){ casaFori = normalizza(d); if (d.salva !== false) scrivi('finestre-fori', casaFori); assetto = derivato(); }   /* il TV resta a tutto schermo */
  else if (d.fori && d.fori.length) assetto = {modo: d.modo === 'doppia' ? 'doppia' : 'unica', fori: d.fori.slice(0, 2)};   /* l'anteprima dell'app */
  if ('mostra' in d) mostraBordi = !!d.mostra;
  impagina();
  if (prima !== JSON.stringify(assetto.modo) + assetto.fori.length && scena.yt) mettiVideo(scena.yt, scena.t);
}
let canale = null;
if (anteprima){
  addEventListener('message', e => { const d = e.data || {}; if (d.tipo === 'occhio') daTelefono(d.x, d.z); else if (d.tipo === 'scena') applica(d.scena, false); else if (d.tipo === 'fori') calibra(Object.assign({}, d, {salva:false})); else if (d.tipo === 'lampo') scocca(); });
} else if (window.supabase){
  /* DMaster al comando: finché arriva il suo battito (ogni 10 s, 30 s di tolleranza) scene, lampi e
     prove di prospettiva valgono solo se vengono da lui; il telefono torna a comandare quando tace */
  let dmasterFino = 0;
  const comandaDM = () => Date.now() < dmasterFino;
  /* con le prestazioni: immagini al secondo davvero disegnate, risoluzione del disegno, qualità (per capire da lontano se fatica) */
  const schedaVideo = () => { try { const g = vista.gl, e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER); } catch(e) { return ''; } };
  const chi = () => ({lato: mio, assetto: tv ? null : casaFori, scena, schermo:{w:innerWidth, h:innerHeight, dpr:devicePixelRatio}, comando: comandaDM() ? 'dmaster' : null,
    prestazioni:{fps: Math.round(fpsMisurati), hzSchermo: Math.round(1000 / intervalloSchermo), msDisegno: Math.round(msDisegno * 10) / 10, scala, qualita, disegno:{w:c.width, h:c.height}, schermoVero:{w:Math.round(screen.width * devicePixelRatio), h:Math.round(screen.height * devicePixelRatio)}, gl: schedaVideo(), browser: navigator.userAgent}});
  /* lo stesso ascolto per il canale del vecchio link e per quello privato della casa (js/accesso.js) */
  const gestore = rispondi => ({
    suMessaggio(evento, dati){
      if (evento === 'dmaster'){ dmasterFino = dati.attivo ? Date.now() + 30000 : 0; return; }
      const daDM = dati && dati.da === 'dmaster';
      if (comandaDM() && !daDM && (evento === 'scena' || evento === 'lampo' || evento === 'occhio')) return;
      if (evento === 'scena'){ const s = Object.assign({}, dati); delete s.da; applica(s); }
      else if (evento === 'lampo') scocca();
      else if (evento === 'fori') calibra(dati);
      else if (evento === 'ricarica') location.reload();
      /* prova delle prestazioni da lontano: spegne per un po' alcune parti del disegno (poi si ricarica e torna tutto) */
      else if (evento === 'prova'){ if (Array.isArray(dati.spegni)) vista.spegni = new Set(dati.spegni); if (dati.scala){ scalaFissa = +dati.scala; scala = scalaFissa; impagina(); } }
      else if (evento === 'occhio') daTelefono(dati.x, dati.z);
      else if (evento === 'chi') rispondi('eccomi', chi());
      else if (evento === 'mostraCodice') mostraCodice();
      else if (evento === 'abbinato' || evento === 'vecchioChiuso') controllaAbbinamento();
    },
    suStato(ok){ if (ok) rispondi('eccomi', chi()); }
  });
  let vecchioChiuso = false;
  if (casa){
    const g = gestore((e, d) => canale && canale.manda(e, d));
    /* a vecchio link chiuso, quello che arriva di lì non conta più */
    canale = apriCanale(casa, {suMessaggio: (e, d) => { if (!vecchioChiuso) g.suMessaggio(e, d); }, suStato: g.suStato});
  }

  /* ── abbinamento alla casa privata ───────────────────────────────────────────
     Ogni schermo entra con un accesso anonimo (resta in questo browser) e diventa membro della casa quando il
     proprietario scrive sul telefono il codice che compare qui. Da lì ascolta anche il canale privato. */
  let privato = null, cartello = null, attesaCodice = null;
  const nomeSchermo = tv ? 'TV' : casaFori.n === 2 ? 'Finestra ' + mio : 'Finestra';
  function apriPrivato(m){
    if (privato || !m) return;
    privato = Accesso.canale(m.casa, gestore((e, d) => privato && privato.manda(e, d)));
    scrivi('atm-casa', m.casa);
  }
  async function controllaAbbinamento(){
    const m = await Accesso.miaCasa().catch(() => null);
    if (m){
      apriPrivato(m); if (cartello) mostraCartello('Aggiunta alla stanza ✓', null, 4000); clearInterval(attesaCodice); attesaCodice = null;
      if (canale && await Accesso.vecchioChiuso(m.casa)){ vecchioChiuso = true; canale.chiudi(); canale = null; }
    }
    return m;
  }
  function mostraCartello(titolo, codice, togliDopo){
    if (!cartello){ cartello = document.createElement('div'); cartello.style.cssText = 'position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(5,5,8,.92);color:#e9d9a8;font:500 2.4vh system-ui;text-align:center;padding:4vh'; document.body.appendChild(cartello); }
    /* il QR porta all'app sul telefono con il codice già dentro: inquadri e confermi */
    let qr = '';
    if (codice && window.qrcode){ const q = qrcode(0, 'M'); q.addData(new URL('../telecomando/?abbina=' + codice, location.href).href); q.make();
      qr = '<div style="background:#fff;padding:1.6vh;border-radius:1vh;line-height:0">' + q.createSvgTag({cellSize: 6, margin: 0, scalable: true}).replace('<svg ', '<svg style="width:min(34vh,60vw);height:auto;display:block" ') + '</div>'; }
    cartello.innerHTML = '<div style="letter-spacing:.2em;text-transform:uppercase;font-size:1.8vh;opacity:.7">' + nomeSchermo + '</div><div>' + titolo + '</div>' + qr +
      (codice ? '<div style="font:700 7vh ui-monospace,monospace;letter-spacing:.15em;color:#f3e3b0">' + codice.slice(0, 3) + ' ' + codice.slice(3) + '</div><div style="font-size:1.8vh;opacity:.75;max-width:60ch">Nell\'app Illusionist sul telefono: «Aggiungi schermo» e inquadra il codice (o scrivi le 6 cifre). Vale 10 minuti.</div>' : '');
    if (togliDopo) setTimeout(() => { if (cartello){ cartello.remove(); cartello = null; } }, togliDopo);
  }
  async function mostraCodice(){
    if (await controllaAbbinamento()){ mostraCartello('Già nella stanza ✓', null, 5000); return; }
    try {
      const codice = await Accesso.codiceSchermo('schermo', nomeSchermo);
      mostraCartello('Aggiungi questo schermo alla tua stanza', codice, 10 * 60e3);
      clearInterval(attesaCodice); attesaCodice = setInterval(controllaAbbinamento, 3000);
      setTimeout(() => { clearInterval(attesaCodice); attesaCodice = null; }, 10 * 60e3);
    } catch(e) { mostraCartello('Codice non disponibile: ' + e.message, null, 15000); }
  }
  /* all'avvio: se è già membro ascolta il canale privato; uno schermo nuovo, senza il vecchio link, mostra subito il codice */
  controllaAbbinamento().then(m => { if (!m && !casa) mostraCodice(); });
  /* gli indirizzi firmati delle immagini valgono 30 giorni: una volta ogni 20 giorni la pagina si rinfresca da sola */
  setTimeout(() => location.reload(), 20 * 24 * 3600e3);

}

/* ── il giro ───────────────────────────────────────────────────────────────── */
impagina();
applica(scena, false);
let prima = performance.now(), lento = 0, qualita = 1, lentoR = 0, fluido = 0, ultimoCalo = -1e9, prossimo = 0;
let ultimoRaf = 0, intervalloSchermo = 1000 / 60, msDisegno = 0;
function giro(ora){
  /* quanto spesso lo schermo chiede un'immagine (60 Hz, 50, 30 se è un 4K su HDMI vecchio…): non si può
     andare più veloci di lui, e andare al suo passo non vuol dire faticare */
  if (ultimoRaf && ora - ultimoRaf < 200) intervalloSchermo = intervalloSchermo * .98 + (ora - ultimoRaf) * .02;
  ultimoRaf = ora;
  /* fluidità: quante immagini al secondo (60, 50, 30… scelto dal telefono o dall'indirizzo dello schermo).
     Si salta un giro quando non è ancora il momento: meno lavoro, ventola più tranquilla */
  const obiettivo = Math.min(60, Math.max(15, fpsUrl || scena.fps || 60)), passo = 1000 / obiettivo;   /* (uno schermo a 30 Hz: fluidità 30 dal telefono) */
  if (obiettivo < 59){
    if (ora < prossimo - 2){ requestAnimationFrame(giro); return; }
    prossimo = ora - prossimo > passo ? ora + passo : prossimo + passo;
  }
  const dt = Math.min(.1, (ora - prima) / 1000); prima = ora;
  if (dt > 0) fpsMisurati = fpsMisurati * .97 + (1 / dt) * .03;
  /* se il computer fa fatica: prima abbassa la risoluzione del disegno (fino a metà), poi toglie gli strati di gocce più fini */
  /* ⚠ 30/10: si guarda il passo medio, non i singoli giri: sul Raspberry i giri erano metà veloci e metà lenti
     (il peggio: va a scatti) e la vecchia regola non scendeva mai */
  lentoR = lentoR * .96 + (dt * 1000 > passo * 1.3 ? .04 : 0);
  if (!scalaFissa && (lentoR > .55 || (intervalloSchermo > passo * 1.25 && ora - ultimoCalo > 4000)) && scala > .5){ scala = Math.max(.5, Math.round((scala - .1) * 10) / 10); lentoR = 0; ultimoCalo = ora; impagina(); }
  fluido = dt * 1000 < passo * 1.07 ? fluido + dt : 0;
  if (!scalaFissa && fluido > 8 && intervalloSchermo < passo * 1.08 && scala < 1 && ora - ultimoCalo > 90000){ scala = Math.min(1, Math.round((scala + .1) * 10) / 10); fluido = 0; impagina(); }
  lento = lento * .97 + (dt * 1000 > passo * 1.56 ? 1 : 0) * .03;
  if (lento > .6 && qualita && scala <= .5) qualita = 0; else if (lento < .1 && !qualita) qualita = 1;
  const k = 1 - Math.exp(-dt * .45);
  const o = oraDi(scena), tgt = METEO[scena.meteo] || METEO.sereno, intens = scena.intensita == null ? .75 : scena.intensita;
  for (const key in tgt){
    let v = tgt[key];
    if (key === 'pioggia' || key === 'neve') v *= .35 + intens * .9;
    if (key === 'vento' && scena.vento != null) v = scena.vento;
    met[key] += (v - met[key]) * k;
  }
  const nc = NEBBIA_ORA[o];
  for (let i = 0; i < 3; i++){ const grigio = o === 'notte' ? .1 : .6; nebCol[i] += (nc[i] + (grigio - nc[i]) * met.coperto * .35 - nebCol[i]) * k; }
  const finta = o === 'notte' && scena.immagini && !vistaDi(scena).im.notte && !scena.yt ? 1 : 0;
  notteFinta += (finta - notteFinta) * k;
  const luceTgt = (o === 'notte' ? scena.luceNotte : scena.luceGiorno) / 100;
  luce += (luceTgt - luce) * Math.min(1, dt * 3);
  scuro += (scuroVerso - scuro) * Math.min(1, dt * 3.2);
  /* uccelli: di giorno (anche all'alba e al tramonto) e col bel tempo; spariscono piano quando cambia */
  const uTgt = scena.uccelli === false || o === 'notte' ? 0
    : Math.max(0, 1 - met.pioggia * 2 - met.neve * 2 - met.tempesta - met.nebbia * 1.3) * (1 - met.coperto * .5);
  uccelli += (uTgt - uccelli) * k;
  /* lo stormo e il rapace (js/uccelli.js), la notte (stelle, fuochi), le ombre delle nuvole, le stelle cadenti */
  stormi.aggiorna(dt, (geom[0] && geom[0].aspetto) || .4, uccelli);
  const nTgt = o === 'notte' ? 1 : o === 'tramonto' ? .15 : 0;
  notte += (nTgt - notte) * k;
  const omTgt = (o === 'notte' ? 0 : o === 'giorno' ? 1 : .5) * (1 - met.coperto) * (1 - met.nebbia);
  ombre += (omTgt - ombre) * k;
  if (meteora){ meteora.k = (ora - meteora.t0) / meteora.dur; if (meteora.k >= 1) meteora = null; }
  else if (notte > .8 && met.coperto < .3 && ora > prossimaMeteora){
    if (prossimaMeteora){ const x0 = .1 + Math.random() * .8, y0 = .03 + Math.random() * .15, verso = Math.random() < .5 ? -1 : 1;
      meteora = {t0: ora, dur: 600 + Math.random() * 500, k: 0, da: [x0, y0, x0 + verso * (.25 + Math.random() * .25), y0 + .06 + Math.random() * .1]}; }
    prossimaMeteora = ora + 40000 + Math.random() * 80000;
  }
  /* il cielo panoramico scorre col vento (in giri del panorama al secondo): dal sereno ci mette un paio di minuti
     ad attraversare una finestra, col temporale meno di uno */
  cieloX = (cieloX + dt * (.00209 + .00836 * met.vento)) % 1000;   /* 30/10: +10%, poi -5% (Maurizio) */
  if (scena.meteo === 'temporale' && ora > prossimoLampo){ if (prossimoLampo) scocca(); prossimoLampo = ora + 4000 + Math.random() * 11000; }
  /* con «Come fuori» l'ora cambia da sola: la luce del paesaggio sfuma piano, in un minuto e mezzo */
  if (!inCambio){ const f = fonteDi(scena); if (f && vista.urlInVista && vista.urlInVista !== chiaveFonte(f) && !vista.inArrivo) vista.mostra(f, 90).catch(() => {}); }
  /* prospettiva viva: acceso dal telefono (o in prova); morbido, così non trema */
  const viva = scena.prospettivaViva || performance.now() < provaFino;
  if (scena.prospettivaViva) apriSensore(); else chiudiSensore();
  const presente = viva && ora - ultimaPresenza < 600;
  const pos = presente ? inseguitore.posizione(ora / 1000) : null;
  if (pos){ occhio.x = Math.max(-1.1, Math.min(1.1, pos.x)); occhio.z = Math.max(-1.1, Math.min(1.1, pos.z)); }
  else {   /* nessuno (o più persone): si torna al centro, piano */
    if (!presente){ occhioTgt.x = 0; occhioTgt.z = 0; }
    const ko = 1 - Math.exp(-dt * 2.2);
    occhio.x += (occhioTgt.x - occhio.x) * ko; occhio.z += (occhioTgt.z - occhio.z) * ko;
  }
  if (misuraVisibile && ora - misura.t0 > 500){ misura.t0 = ora; mostraMisura(); }
  margine += ((viva || Math.abs(occhio.x) > .01 ? 1.2 : 1.04) - margine) * (1 - Math.exp(-dt * .8));
  const t0d = performance.now();
  vista.disegna(geomGL, {
    t: (ora / 1000) % 3588, trasparente: !!scena.yt, movimento: scena.movimento !== false, prospettiva: scena.prospettiva !== false,
    coperto: met.coperto, nebbia: met.nebbia, pioggia: met.pioggia, neve: met.neve, tempesta: met.tempesta, vento: met.vento,
    lampo: intensitaLampo(ora), lampoX, uccelli, stormi: stormi.dati(), notte, ombre, meteora, cieloX, notteFinta, luce, buio: scuro, qualita, colNebbia: nebCol, occhio, margine
  });
  msDisegno = msDisegno * .95 + (performance.now() - t0d) * .05;
  requestAnimationFrame(giro);
}
requestAnimationFrame(giro);
</script>
</body>
</html>
